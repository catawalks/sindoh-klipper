# PrusaSlicer config bundle: Sindoh 3DWOX 1X running Klipper (klipper_port)
# File > Import > Import Config Bundle (PrusaSlicer and SuperSlicer).
# Bed: 228 x 200 mm, X 0 / Y 0 at the front left, as Sindoh's own slicer
# has it. Height 300 mm.
# Starting values (2026-11-23): Sindoh's "Normal" profile for the 1X
# (40 mm/s, travel 130 mm/s, retract 6 mm, PLA at 200 C with the fan at
# 50 %), with our first layer (0.25 mm at 210 C, 20 mm/s) and a prime
# line at the front edge of the bed (PRIME_LINE). Not tuned yet:
# retraction, pressure advance and speeds come later.

[print:1X 0.20mm Klipper]
layer_height = 0.2
first_layer_height = 0.25
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
perimeter_speed = 40
external_perimeter_speed = 30
small_perimeter_speed = 20
infill_speed = 40
solid_infill_speed = 40
top_solid_infill_speed = 20
first_layer_speed = 20
travel_speed = 130
travel_speed_z = 7
bridge_speed = 25
gap_fill_speed = 20
support_material_speed = 40
default_acceleration = 2000
first_layer_acceleration = 800
skirts = 0
brim_width = 0
gcode_label_objects = firmware
gcode_comments = 0
complete_objects = 0
avoid_crossing_perimeters = 0
compatible_printers_condition = printer_notes=~/.*X1_KLIPPER.*/

[filament:1X PLA]
filament_type = PLA
filament_diameter = 1.75
extrusion_multiplier = 1
first_layer_temperature = 210
temperature = 200
first_layer_bed_temperature = 60
bed_temperature = 60
fan_always_on = 1
min_fan_speed = 50
max_fan_speed = 100
disable_fan_first_layers = 2
bridge_fan_speed = 100
cooling = 1
slowdown_below_layer_time = 10
fan_below_layer_time = 30
min_print_speed = 10
filament_max_volumetric_speed = 8
start_filament_gcode = "; Filament gcode\n"
compatible_printers_condition = printer_notes=~/.*X1_KLIPPER.*/

[printer:Sindoh 1X Klipper]
printer_technology = FFF
printer_notes = X1_KLIPPER
bed_shape = 0x0,228x0,228x200,0x200
max_print_height = 300
nozzle_diameter = 0.4
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0
autoemit_temperature_commands = 0
retract_length = 6
retract_speed = 35
deretract_speed = 35
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 0
retract_lift_top = "All surfaces"
retract_before_travel = 1.5
retract_layer_change = 1
wipe = 0
machine_limits_usage = time_estimate_only
machine_max_feedrate_x = 197
machine_max_feedrate_y = 197
machine_max_feedrate_z = 12
machine_max_feedrate_e = 86
machine_max_acceleration_x = 2500
machine_max_acceleration_y = 2500
machine_max_acceleration_z = 100
machine_max_acceleration_extruding = 2500
machine_max_acceleration_retracting = 1100
machine_max_acceleration_travel = 2500
start_gcode = PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]\nPRIME_LINE\nG90\nM83\n
end_gcode = PRINT_END\n
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n
layer_gcode = ;AFTER_LAYER_CHANGE\n
thumbnails = 32x32/PNG, 300x300/PNG

[presets]
print = 1X 0.20mm Klipper
filament = 1X PLA
printer = Sindoh 1X Klipper
