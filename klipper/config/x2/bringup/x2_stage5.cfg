# Sindoh 3DWOX 2X on its NAND board ("Prime_r1", board name TOC): the
# look-only step of the port (docs/2x_port_plan.md, order of work 3).
# STAGE 5: the look-only config plus the fans and the lamp, each OFF until
# switched by hand, to see which output is which (owner watching).
# No heater and no motor is defined here.
# Written 2026-11-28 from the 1X's x1_stage4.cfg and what was read from
# the stock 2X (sindoh docs/2x.md). Run 2026-11-28. Not a printer config.
# Head numbers are stock's: head 2 is the left one (the 1X's only head),
# head 1 the right one.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

