# ADC inputs as the stock IO microcode scans them (mux select 1 to 4).
# Select 1 is the 1X's nozzle, so head 2 here; select 4 reads open on a
# 1X and is expected to be head 1's nozzle (to be confirmed: if it is
# not connected Klipper stops with "ADC out of range", which is harmless
# in this config).
# min_temp/max_temp must stay inside the tables: Klipper turns them into
# ADC limits and shuts the MCU down ("ADC out of range") otherwise.
[temperature_sensor nozzle_head2]
sensor_type: x1_nozzle
sensor_pin: io:adc1
adc_voltage: 1.0
min_temp: 2
max_temp: 290

[temperature_sensor nozzle_head1]
sensor_type: x1_nozzle
sensor_pin: io:adc4
adc_voltage: 1.0
min_temp: 2
max_temp: 290

[temperature_sensor bed]
sensor_type: x1_bed
sensor_pin: io:adc2
adc_voltage: 1.0
min_temp: 2
max_temp: 120

# Reads the same as select 2 under stock; what it is, is not known yet.
[temperature_sensor bed_b]
sensor_type: x1_bed
sensor_pin: io:adc3
adc_voltage: 1.0
min_temp: 2
max_temp: 120

# Inputs on the SoC GPIO block (Linux GPIO numbers). Which sensor is
# which head's comes from the stock FM program (it picks the line by the
# enabled driver); the extruder entry sensors are on 134/135 on this
# board (1X: 120/121). On the 1X "PRESSED" (low) is filament present.
[gcode_button head1_bay_filament]
pin: gpio76
press_gcode:

[gcode_button head2_bay_filament]
pin: gpio80
press_gcode:

[gcode_button head1_extruder_filament]
pin: gpio135
press_gcode:

[gcode_button head2_extruder_filament]
pin: gpio134
press_gcode:

# Home sensors: X of the left head (head 2, homes left) and Y (bed, homes
# at the back) are high at home as on the 1X, so "PRESSED" means "at
# home". The right head's is GPIO 74, found 2026-11-28 by sliding head 1
# off its home by hand with every input watched: 1 at home, 0 off it.
[gcode_button x_home_head1]
pin: gpio74
press_gcode:

[gcode_button x_home_head2]
pin: gpio99
press_gcode:

[gcode_button y_home]
pin: gpio82
press_gcode:

# Z home (seen changing once per stock Z homing; level at home not checked)
[gcode_button z_home]
pin: gpio83
press_gcode:

# Nozzle-to-bed contact (bed leveling). Stock switches its enable line
# (GPIO 153) on first; without that this reading means nothing.
[gcode_button nozzle_contact]
pin: gpio81
press_gcode:

# ---- outputs, one at a time (SET_FAN_SPEED FAN=name SPEED=1, SET_PIN) ----
# Known from the 1X: part fan pwm2, hot end fan gpio188 (head 2), right
# exhaust pwm20, PSU fan pwm10 with enable 127, lamp pwm7. On this board
# the left exhaust enable is GPIO 126 (1X: 112). Expected for head 1 and
# to be found here: hot end fan gpio225, part fan pwm14 or pwm22.
[fan_generic part_head2]
pin: io:pwm2

[fan_generic cand_pwm14]
pin: io:pwm14

[fan_generic cand_pwm22]
pin: io:pwm22

[output_pin hotend_fan_head2]
pin: io:gpio188
value: 0

[output_pin cand_gpio225]
pin: io:gpio225
value: 0

[fan_generic exhaust_right]
pin: io:pwm20

[output_pin exhaust_left]
pin: io:gpio126
value: 0

[fan_generic psu_fan]
pin: io:pwm10
enable_pin: io:gpio127
hardware_pwm: True
cycle_time: 0.0001

[output_pin lamp]
pin: io:pwm7
value: 0
shutdown_value: 0

[respond]
