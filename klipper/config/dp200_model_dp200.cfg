# =====================================================================
# Sindoh DP200 / DP102 ("Rodin P"): the heated bed. Port-owned, replaced
# on every install or upgrade. The installer copies this file to
# dp200_model.cfg on a DP200-family printer (model ID, sindoh
# docs/dp200_family_models.md); dp200_macros.cfg includes that file last.
# =====================================================================

[adc_temperature dp200_bed]
# Stock firmware table (tools/gen_thermistors.py, adc_bed_mC_lookup_table) rescaled to the
# bed SURFACE: T = 0.824 * T_stock - 0.77, fitted 2026-10-21 to a kapton-taped K thermocouple
# after 10 min soaks: stock 23.96/39.97/59.99/79.99 -> surface 19/32/49/65 C (max error 0.35 C).
# Above ~80 C the line is extrapolated.
temperature1: -0.77
voltage1: 0.92139
temperature2: 7.55
voltage2: 0.88330
temperature3: 15.79
voltage3: 0.83447
temperature4: 24.03
voltage4: 0.77490
temperature5: 32.19
voltage5: 0.70654
temperature6: 40.43
voltage6: 0.63184
temperature7: 48.75
voltage7: 0.55469
temperature8: 56.91
voltage8: 0.47949
temperature9: 65.15
voltage9: 0.40918
temperature10: 73.47
voltage10: 0.34570
temperature11: 81.63
voltage11: 0.29053
temperature12: 89.95
voltage12: 0.24268
temperature13: 98.19
voltage13: 0.20264

[heater_bed]
heater_pin: io:pwm24           # dec_pwm block 0x18
max_power: 1.0                 # stock runs the bed at 100 %; at 0.6 it heats too slowly above
                               # 60 C for verify_heater (tripped at 2026-10-21 going to 80 C)
sensor_type: dp200_bed
sensor_pin: io:adc1
adc_voltage: 1.0
min_temp: 5
max_temp: 100                  # stock table ends ~125 C
# control / pid_Kp / pid_Ki / pid_Kd: per printer -> printer.cfg (PID_CALIBRATE)

[verify_heater heater_bed]
max_error: 120
check_gain_time: 90
hysteresis: 5
heating_gain: 2
