# =====================================================================
# Sindoh DP201 ("Rodin E"): PLA only, no heated bed. Port-owned, replaced
# on every install or upgrade. The installer copies this file to
# dp200_model.cfg on a DP201-family printer (model ID: sindoh
# docs/dp200_family_models.md); dp200_macros.cfg includes that file last,
# so the sections below override the DP200's.
#
# What the stock firmware does differently on a DP201 (same firmware as
# the DP200, read from its motion program 2026-11-24): no bed
# (ifBedNotUsed), Z max 194.6 mm against 200.6 (6 mm less travel), print
# height limit 189 mm against 195, its own leveling points and fan
# settings. The part-cooling fan sits on the side of the head (owner):
# same pins and control, no change here.
#
# NOT TESTED on a DP201 yet (none here). Check in order: homing (X, Y,
# then Z with the bed empty), the Z travel (position_max below), the
# probe pin and a mesh, a PLA print.
# =====================================================================

[stepper_z]
# The DP200's 194 less the stock program's 6 mm (194.6 against 200.6 mm).
# Measure on the printer: lower the bed to the bottom slowly and read Z.
position_max: 188

# No [heater_bed]: Klipper then has no M140 / M190. Slicers still send
# them (PLA profiles with a bed temperature): accept them, ignore the
# temperature and say so (once until Klipper restarts).
[gcode_macro M140]
description: No heated bed on the DP201: the bed temperature is ignored
variable_warned: 0
gcode:
    {% if params.S|default(0)|float > 0 and not printer["gcode_macro M140"].warned %}
        M118 DP201: no heated bed, bed temperature {params.S|default(0)|float|int} C ignored
        SET_GCODE_VARIABLE MACRO=M140 VARIABLE=warned VALUE=1
    {% endif %}

[gcode_macro M190]
description: No heated bed on the DP201: nothing to wait for
gcode:
    M140 {rawparams}

# The print start without the bed step: the same list (the touch screen
# shows it, and _PRINT_START_BODY numbers the steps); its M140/M190 go to
# the macros above.
[gcode_macro PRINT_START]
variable_steps: ['Bed empty? (question)', 'Homing', 'No heated bed (skipped)', 'Probing the bed (mesh)', 'Heating the nozzle', 'Purging and wiping']

[gcode_macro FILAMENT_DRY]
description: Not on the DP201 (no heated bed)
gcode:
    {action_raise_error("FILAMENT_DRY: the DP201 has no heated bed")}
