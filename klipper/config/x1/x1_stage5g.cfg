# ADC inputs as the stock IO microcode scans them (mux select 1 to 4).
# Select 4 reads open on the 1X (the 2X's second nozzle) and is left out.
# min_temp/max_temp must stay inside the tables: Klipper turns them into
# ADC limits and shuts the MCU down ("ADC out of range") otherwise.
# Reads the same as select 2 under stock; what it is, is not known yet.
[temperature_sensor bed_b]
sensor_type: x1_bed
sensor_pin: io:adc3
adc_voltage: 1.0
min_temp: 2
max_temp: 120

# Inputs on the SoC GPIO block (Linux GPIO numbers). Names from the
# stock program; which level means "filament present" is to be checked.
[gcode_button cart_filament_0]
pin: gpio76
press_gcode:

[gcode_button extr_filament_0]
pin: gpio121
press_gcode:

# Home sensors, found 2026-11-21 by moving the head and bed by hand under
# the stock firmware and again under Klipper. X (head, homes left) and
# Y (bed, homes at the back) are both high at home, so "PRESSED" below
# means "at home".
[gcode_button x_home]
pin: gpio99
press_gcode:

[gcode_button y_home]
pin: gpio82
press_gcode:

# Z home (seen changing once per stock Z homing; level at home not checked)
[gcode_button z_home]
pin: gpio83
press_gcode:

# Nozzle-to-bed contact (bed leveling). Stock switches its enable line
# (GPIO 153) on first; without that this reading means nothing.
[gcode_button nozzle_contact]
pin: gpio81
press_gcode:

# ---------------------------------------------------------------------
# Heaters under test. On paper (the recorded stock load): PWM block 5 is
# the nozzle, 28 the bed. Limits are low on purpose: Klipper shuts the
# heater off above max_temp, and verify_heater stops a heater whose
# sensor does not follow. The power supply fan (pwm10) keeps running as
# stock left it. PWM block 25 (the 2X's other nozzle) is not defined.
# ---------------------------------------------------------------------
[extruder]
step_pin: smot_step3
dir_pin: !smot_dir3             # feed = direction bit clear
enable_pin: !gpio44
microsteps: 16
rotation_distance: 6.9747       # 458.8 steps/mm
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: io:pwm5
sensor_type: x1_nozzle
sensor_pin: io:adc1
adc_voltage: 1.0
control: watermark
max_delta: 2.0
max_power: 0.6
min_temp: 2
max_temp: 260
min_extrude_temp: 170
max_extrude_only_distance: 60
max_extrude_only_velocity: 60
max_extrude_only_accel: 800

[verify_heater extruder]
check_gain_time: 60
heating_gain: 2
max_error: 240

[heater_generic bed_test]
heater_pin: io:pwm28
sensor_type: x1_bed
sensor_pin: io:adc2
adc_voltage: 1.0
control: watermark
max_delta: 1.0
max_power: 0.6
min_temp: 2
max_temp: 75

[verify_heater bed_test]
check_gain_time: 180
heating_gain: 1
max_error: 240

# Power supply fan (PWM block 10, enable GPIO 127): must run whenever a
# heater is on (owner, twice: stock does the same, 80%). It also runs
# while any motor is enabled, and for a minute after.
[controller_fan psu_fan]
pin: io:pwm10
enable_pin: io:gpio127
hardware_pwm: True
cycle_time: 0.0001
fan_speed: 0.8
idle_timeout: 60
heater: extruder, bed_test

# Extruder (hot end) fan: on whenever the nozzle is above 45 C.
[heater_fan extruder_fan]
pin: io:gpio188
heater: extruder
heater_temp: 45.0

# The initial feed motor at the cartridge bay (stepper engine 4: step
# GPIO 48, dir 49, driver number 6). Stock runs it with the extruder at
# the same filament speed whenever the extruder runs, cartridge or open
# filament, so it follows the extruder here. LOAD and UNLOAD below take
# it off the extruder for the stretches where stock runs it alone.
[extruder_stepper feed]
extruder: extruder
step_pin: smot_step4
dir_pin: !smot_dir4             # feed = direction bit clear
enable_pin: !gpio50
microsteps: 16
rotation_distance: 14.523       # 220.35 steps/mm (stock ratio to the extruder)

# Bay switch: low while filament runs through the opening port (or a
# cartridge lifts its arm). It releases while the end of the filament is
# still ahead of the gears, so it is the runout sensor (owner 11-21):
# the rest can then be pulled out by a normal UNLOAD_FILAMENT.
[filament_switch_sensor bay]
switch_pin: !gpio80
pause_on_runout: True
runout_gcode:
    M118 Filament ran out at the bay. UNLOAD_FILAMENT, LOAD_FILAMENT, then RESUME

# Low while filament is at the extruder's entry. Only read by the
# routines below.
[filament_switch_sensor extruder_entry]
switch_pin: !gpio120
pause_on_runout: False

[pause_resume]

[force_move]                    # the last stretch of the unload (FORCE_MOVE)
enable_force_move: True

[respond]

# Feed until a sensor changes (klippy/extras/feed_until.py, fork 13f24017 or
# later; klipper/FORK is not moved to it until it has run on a printer):
# the motors are stopped in the micro-controller the moment the sensor
# changes, as in homing. Same pins as the two sensors above.
[feed_until extruder_entry]
pin: !gpio120
steppers: feed, extruder

[feed_until bay]
pin: !gpio80
steppers: feed

# Filament motion pick-ups (klippy/extras/feed_encoder.py in our fork);
# each changes level about once per 0.9 mm of filament. From the
# recordings of 2026-11-21: GPIO 65 sees the filament about 130 mm after
# it has passed the extruder's entry sensor, GPIO 67 sits about 240 mm
# after the bay switch. FEED_UNTIL ENCODER= stops a move with "Filament
# not moving" when the named one stands still for jam_distance.
[feed_encoder head]
pin: gpio65
jam_distance: 30

[feed_encoder bay]
pin: gpio67
jam_distance: 30

# ---------------------------------------------------------------------
# LOAD and UNLOAD, copied from the stock routines as recorded on
# 2026-11-21 (sindoh docs/1x_stock_routines.md). First runs: this stage.
#   Stock load: initial feed motor alone at 59 mm/s until the filament
#   reaches the extruder (GPIO 120; 412 mm in the recording), both
#   motors 857 mm at 29.7 mm/s, 2 s pause, purge 60 mm at 2 mm/s,
#   retract 18.6 mm. Stock unload: both back at 29.7 mm/s until GPIO 120
#   releases (914 mm), then the initial feed motor alone at 59 mm/s
#   until 4 s after the bay switch releases (789 mm in all).
# Jam check (owner 11-21): every stretch watches a pick-up where the
# filament is known to be on it; JAM_AFTER / JAM_UNTIL are that window.
# ---------------------------------------------------------------------
[gcode_macro _X1]
variable_home_x: 262.7          # stock number of the X home sensor
variable_park_x: 256.4          # stock load position, over the dump station
variable_after_x: 243.4         # stock moves here after the purge
variable_load_temp: 220         # stock PLA: 200 while feeding, 220 for the purge
variable_feed_speed: 59         # initial feed motor alone, mm/s
variable_feed_accel: 500        # CHECK
variable_feed_max: 600          # give up if the extruder sensor has not tripped
variable_both_speed: 29.7       # both motors, mm/s
variable_to_nozzle: 857         # extruder sensor to the nozzle, as stock feeds
variable_hot_part: 150          # CHECK: the last stretch of it, fed only at temperature
variable_purge: 60
variable_purge_speed: 2.0
variable_load_retract: 18.6
variable_unload_max: 1100       # give up if the extruder sensor has not released
variable_bay_max: 900           # give up if the bay switch has not released
variable_bay_extra: 240         # stock runs on about 4 s after the bay switch
variable_head_after: 160        # CHECK: load, mm past the entry sensor before GPIO 65 must move
variable_head_until: 600        # CHECK: unload, GPIO 65 is watched for this many mm
variable_bay_until: 150         # CHECK: unload, GPIO 67 is watched for this many mm
gcode:

# Over the dump station (owner 11-21: at the home sensor the nozzle sits
# under the cleaning flap, not over the bin). Stock loads at X 256.4 and
# moves to 243.4 after the purge; its home is 262.7, so these are 6.3 and
# 19.3 mm to the right of the sensor. X is a manual stepper here, so the
# head must stand at its home sensor when this is first run: it backs
# off, finds the sensor again and goes to the station. Z is not moved
# (stock: Z 23.1).
[gcode_macro _X1_PARK]
variable_homed: 0
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% if not homed %}
        {% if printer["gcode_button x_home"].state != "PRESSED" %}
            {action_raise_error("X is not at its home sensor: home it first (tools/x1_home_sections.sh x_test x_home +)")}
        {% endif %}
        MANUAL_STEPPER STEPPER=x_test SET_POSITION=0
        MANUAL_STEPPER STEPPER=x_test MOVE=-10 SPEED=10
        MANUAL_STEPPER STEPPER=x_test MOVE=10 SPEED=10 STOP_ON_ENDSTOP=1
        MANUAL_STEPPER STEPPER=x_test SET_POSITION={c.home_x}
        SET_GCODE_VARIABLE MACRO=_X1_PARK VARIABLE=homed VALUE=1
    {% endif %}
    MANUAL_STEPPER STEPPER=x_test MOVE={c.park_x} SPEED=15

[gcode_macro _X1_AFTER_LOAD]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    MANUAL_STEPPER STEPPER=x_test MOVE={c.after_x} SPEED=15

[gcode_macro LOAD_FILAMENT]
description: Load filament pushed in through the opening port, purge over the dump station. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    {% if not printer["filament_switch_sensor bay"].filament_detected %}
        {action_raise_error("LOAD_FILAMENT: push the filament in through the opening port until the bay switch trips, then run it again")}
    {% endif %}
    _X1_PARK
    M104 S{temp}
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed STATE=1 DISTANCE={c.feed_max} SPEED={c.feed_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=bay JAM_AFTER=30
    # most of the way while the nozzle heats (owner 11-21); every stretch
    # stops if the filament leaves the entry sensor or stands still
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE={c.to_nozzle - c.hot_part} SPEED={c.both_speed} ACCEL={c.feed_accel} FORBID=1 COLD=1 ENCODER=head JAM_AFTER={c.head_after}
    M109 S{temp}
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE={c.hot_part} SPEED={c.both_speed} ACCEL={c.feed_accel} FORBID=1 ENCODER=head
    M83
    G4 P2000
    G1 E{c.purge} F{c.purge_speed * 60}
    G1 E-{c.load_retract} F{c.both_speed * 60}
    M400
    M104 S{prev}
    _X1_AFTER_LOAD
    M118 Load complete

[gcode_macro UNLOAD_FILAMENT]
description: Pull the filament back out of the opening port. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    _X1_PARK
    M109 S{temp}
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE=-{c.unload_max} SPEED={c.both_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=head JAM_UNTIL={c.head_until}
    M104 S{prev}
    FEED_UNTIL SENSOR=bay STEPPERS=feed STATE=0 DISTANCE=-{c.bay_max} SPEED={c.feed_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=bay JAM_UNTIL={c.bay_until}
    FORCE_MOVE STEPPER="extruder_stepper feed" DISTANCE=-{c.bay_extra} VELOCITY={c.feed_speed} ACCEL={c.feed_accel}
    M118 Unload complete - pull the filament out of the opening port

# ---------------------------------------------------------------------
# Motors under test. Hardware pulse engines 0/1/2 = X/Y/Z, as the stock
# firmware uses them; the TMC222x drivers keep the stock set-up (16
# microsteps, current from the reference PWM stock left running).
# Enable lines are the drivers' ENN pins (active low): GPIO 164 X,
# 170 Y, 38 Z. Checked 2026-11-21: each axis moved 5 mm and back.
# Positive direction: X left (toward home), Y forward (away from home),
# Z down (away from home).
# Drive with:  MANUAL_STEPPER STEPPER=x_test ENABLE=1
#              MANUAL_STEPPER STEPPER=x_test SET_POSITION=0
#              MANUAL_STEPPER STEPPER=x_test MOVE=5 SPEED=10
# ---------------------------------------------------------------------
# The home sensors are also shown as buttons above (for the status tool).
[duplicate_pin_override]
pins: gpio99, gpio82, gpio83

# Homing: tools/x1_home_sections.sh (the sensor must read released
# first). A MOVE enables the driver by itself. X and Y homed this way
# 2026-11-21 (X left = positive, Y back = negative).
[manual_stepper x_test]
step_pin: smot_step0
dir_pin: smot_dir0
enable_pin: !gpio164
endstop_pin: gpio99            # high at home
microsteps: 16
rotation_distance: 40          # 80 steps/mm
velocity: 10
accel: 200

[manual_stepper y_test]
step_pin: smot_step1
dir_pin: smot_dir1
enable_pin: !gpio170
endstop_pin: gpio82            # high at home
microsteps: 16
rotation_distance: 39.801      # 80.4 steps/mm
velocity: 10
accel: 200

[manual_stepper z_test]
step_pin: smot_step2
dir_pin: smot_dir2
enable_pin: !gpio38
endstop_pin: gpio83            # low away from home; homes upward (negative)
microsteps: 16
rotation_distance: 1.25        # 2560 steps/mm
velocity: 2
accel: 20
