# Sindoh 3DWOX 1X: stage 5g of the port (docs/1x_port_plan.md).
# As stage 5f, but the nozzle is a real [extruder] with the initial feed
# motor following it, the two filament sensors, and LOAD_FILAMENT /
# UNLOAD_FILAMENT on the fork's feed_until module (stop on a sensor).
# X, Y and Z are still manual steppers; LOAD_FILAMENT moves X from its
# home sensor to the dump station by itself. Not a printer config yet.
# Started by install/x1/x1_stage4.sh start x1_stage5g.cfg.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

[printer]
kinematics: none
max_velocity: 100
max_accel: 1000

# Thermistor tables: the stock firmware's own (tools/gen_thermistors.py on
# the 1X program; they equal the DP200's, with the same index bases).
# Checked 2026-11-21 against the stock firmware's live values.
