[printer]
kinematics: cartesian           # head on X; the bed moves on Y and on Z
# Stock's own ramp tables, compiled into its program (read 2026-11-22):
# X/Y run up to 197.7 mm/s in 8 mm (0.13 s: about 1460 mm/s2 on average),
# Z up to 12.0 mm/s (about 110 mm/s2), the extruder from 20 to 86.7 mm/s
# (about 1100 mm/s2). Stock's maintenance moves use about 102 mm/s and
# 223 mm/s2. Database jerk: XY 20, Z 0.1, E 5 mm/s.
# Tested under Klipper 2026-11-22 (tools/x1_speed_test.py): five 210 mm
# trips on X and five 170 mm trips on Y at 197 mm/s and 1500 mm/s2,
# then each axis was within 0.5 mm at its home sensor. Z and the
# extruder have not been run at their limits.
# max_accel 2500 is what Sindoh's own slicer (3DWOX Desktop) assumes for
# the 1X (owner 2026-11-22; their Cura definition says 2000, the stock
# ramp tables average about 1460). The speed test passed at 2000 that
# day and at 2500 on 2026-11-24 (5 trips each way at 197 mm/s, X and Y
# within 0.5 mm at their home sensors).
max_velocity: 197
max_accel: 2500
max_z_velocity: 12
max_z_accel: 100

# Drivers: five TMC2224 (X, Y, Z, extruder, cartridge feed), 16
# microsteps by their MS pins. Their registers are set over a UART that
# is a Linux port, not a UPC pin: tools/x1_tmc.py setup writes the stock
# values before Klipper starts (cold start; after a stock boot they are
# already there). Current is set by the reference outputs further down.

# X: positive is RIGHT, away from the home sensor on the left (stock's
# frame for this head: -38.2 ... 232.5 mm).
[stepper_x]
step_pin: smot_step0
dir_pin: !smot_dir0             # positive X is to the RIGHT (the direction bit set moves left)
enable_pin: !gpio164
microsteps: 16
rotation_distance: 40           # 80 steps/mm
endstop_pin: gpio99             # high at home
# The stock frame, read from the stock program 2026-11-23: X 0 is the
# LEFT edge of the bed and X grows to the RIGHT, as slicers expect. The
# head (the stock "X2" carriage) homes on the left: the home sensor's
# edge is at -17.85 (StepperHomeX2FindHome sets that position there),
# the left wall and stock's park position at -38.2, the right limit at
# 232.5 (StepperAbsoluteMoveX2's range: -3056 to 18600 steps). The bed
# is X 0 to 228.
# Until 2026-11-23 this file had X the other way round (0 at the right
# edge, home at 262.7: the range the stock program PRINTS, which is the
# 2X's other carriage), and prints came out mirrored. Old X values
# convert as: new = 224.5 - old.
position_endstop: -17.85
position_min: -38.2
position_max: 232.5
homing_speed: 100               # stock seeks at about 102 mm/s (recorded 2026-11-22: moves of
                                # 35 to 130 mm fit 102 mm/s with ramps of about 223 mm/s2)
second_homing_speed: 10         # stock's slow 4.9 mm search runs at 10.2 mm/s
# The home sensor switches on 20.35 mm before the left end of travel and
# stays on from there (measured 2026-11-22: 19.3 mm with the head pushed
# to the wall by hand, 20.3 mm from where stock parks it); the dump and
# cleaning stations lie inside that stretch. Homing from inside it:
# _SINDOH_HOME_AXIS. The stock database's X positions (leveling points,
# load, cleaning) are in this frame.
homing_positive_dir: False

# Y: the bed. Positive is FORWARD; home is at the back.
[stepper_y]
step_pin: smot_step1
dir_pin: smot_dir1
enable_pin: !gpio170
microsteps: 16
rotation_distance: 39.801       # 80.4 steps/mm
endstop_pin: gpio82             # high at home
position_endstop: 5.5           # the sensor's edge: 5.5 mm from where stock parks the bed after
                                # homing (measured 2026-11-22; taken as stock's Y 0)
position_min: 0
position_max: 200.5             # stock probes the back notch at Y 200.2
homing_speed: 75                # stock seeks at about 100 mm/s here too (recorded from mid-travel,
                                # 2026-11-22) but lets the bed run on 3.6 mm after the sensor.
                                # Klipper stops it dead: at 100 that is too harsh (owner)
second_homing_speed: 10         # stock: 10.2 mm/s

# Z: the bed. Positive is DOWN; home is at the top, toward the nozzle.
# NEVER home Z with anything on the bed.
[stepper_z]
step_pin: smot_step2
dir_pin: smot_dir2
enable_pin: !gpio38
microsteps: 16
rotation_distance: 1.25         # 2560 steps/mm
endstop_pin: gpio83             # high at home
position_min: -2.0              # the notch touches (about Z -1.2) and stock's scrub (about -1.7)
                                # lie below the print surface: Z goes below 0 for them
position_max: 310
homing_speed: 7.4               # stock comes up at 7.42 mm/s and takes the first trip (it runs
                                # on about 1.5 mm, then goes down 7.24 mm to rest)
second_homing_speed: 2          # ours: stock has no second approach
homing_retract_dist: 3          # the sensor lets go within about 0.3 s of the bed going down

# ---------------------------------------------------------------------
# Motor current: each TMC2224 takes its current from its VREF pin
# (GCONF I_scale_analog), a filtered hardware PWM of period 200. Stock
# rule, as on the DP200: high = 100 + offset, the offsets from karas.db
# CONF_ENGINE_PWM row NO=4. This printer: X 0 (the column is X2OFFSET:
# the 1X's head is the 2X's left one), Y +40, Z +40, E +50, C (cartridge
# feed) +9. Klipper sends value * 255 as an 8-bit count (cut off at
# start-up, rounded by SET_PIN) and the UPC port sets high = count *
# 200 / 255 (cut off). So value = (ceil(high * 255 / 200) + 0.25) / 255
# lands on the stock count both ways (read back 2026-11-24 with devmem:
# 100, 140, 140, 150, 109). (high + 0.5) / 200, used before, gave 149
# for E's 150.
# Which output is which motor was tested on 2026-11-22: with one output
# at 0, a short hard move leaves that motor behind (the home sensor
# shows it). X is 29 and Y is 30 by that test; Z is 31 (the other +40);
# E is 32 and C is 21 by their values. Blocks 13 and 23 also run on a 1X
# (at 100) and are neither X nor Y: the 2X's second head, our reading.
# A motor with its reference at 0 still turns slowly without load.
# ---------------------------------------------------------------------
[output_pin motor_current_x]       # X2OFFSET 0
pin: io:pwm29
pwm: True
hardware_pwm: True
cycle_time: 0.0001             # ignored by the UPC port (stock period 200)
value: 0.5029
shutdown_value: 0.5029

[output_pin motor_current_y]       # YOFFSET +40
pin: io:pwm30
pwm: True
hardware_pwm: True
cycle_time: 0.0001             # ignored by the UPC port (stock period 200)
value: 0.7029
shutdown_value: 0.7029

[output_pin motor_current_z]       # ZOFFSET +40
pin: io:pwm31
pwm: True
hardware_pwm: True
cycle_time: 0.0001             # ignored by the UPC port (stock period 200)
value: 0.7029
shutdown_value: 0.7029

[output_pin motor_current_e]       # EOFFSET +50
pin: io:pwm32
pwm: True
hardware_pwm: True
cycle_time: 0.0001             # ignored by the UPC port (stock period 200)
value: 0.7539
shutdown_value: 0.7539

[output_pin motor_current_c]       # COFFSET +9: cartridge feed motor
pin: io:pwm21
pwm: True
hardware_pwm: True
cycle_time: 0.0001             # ignored by the UPC port (stock period 200)
value: 0.5461
shutdown_value: 0.5461

[output_pin motor_current_spare13] # not X, Y (2X: second head?)
pin: io:pwm13
pwm: True
hardware_pwm: True
cycle_time: 0.0001             # ignored by the UPC port (stock period 200)
value: 0.5029
shutdown_value: 0.5029

[output_pin motor_current_spare23] # not X, Y (2X: second head?)
pin: io:pwm23
pwm: True
hardware_pwm: True
cycle_time: 0.0001             # ignored by the UPC port (stock period 200)
value: 0.5029
shutdown_value: 0.5029

# This printer's own values, written by the installer from its karas.db
# (not written yet for the 1X); a missing file is no error.
[include x1_machine*.cfg]

# Extruder: stepper engine 3 (step GPIO 42, dir 43, driver number 4,
# spreadCycle), the motor at the rear; the filament runs from it through
# a tube to the nozzle. Driven by Klipper as a manual stepper on
# 2026-11-21 (x1_stage5f.cfg), as was the heater (PWM block 5).
[extruder]
step_pin: smot_step3
dir_pin: !smot_dir3             # feed = direction bit clear
enable_pin: !gpio44
microsteps: 16
rotation_distance: 6.9747       # 458.8 steps/mm (stock, by its engine counter)
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: io:pwm5             # CHECK with low limits first
sensor_type: x1_nozzle
sensor_pin: io:adc1
adc_voltage: 1.0
min_temp: 2
max_temp: 265                   # stock loads ABS at 250 and cuts its heater at 270
max_power: 1.0                  # stock: full power (database PWM_EX_MAX 1000 of 1000)
min_extrude_temp: 170
max_extrude_only_distance: 60   # the load and unload move in 50 mm pieces
max_extrude_only_velocity: 86   # stock table top
max_extrude_only_accel: 1100    # stock table

[heater_bed]
heater_pin: io:pwm28            # CHECK with low limits first
sensor_type: x1_bed
sensor_pin: io:adc2             # select 3 reads the same sensor
adc_voltage: 1.0
min_temp: 2
max_temp: 100                   # CHECK: no stock limit found. The stock tables only preheat the
                                # bed to 50; print temperatures come from the slicer, and the
                                # sensor table ends at 125 C
max_power: 1.0                  # stock: full power (database PWM_BD_MAX 1000 of 1000)

[verify_heater extruder]
check_gain_time: 60
heating_gain: 2
max_error: 240

[verify_heater heater_bed]
check_gain_time: 180
heating_gain: 1
max_error: 240

[temperature_sensor bed_b]      # reads the same as the bed sensor under stock
sensor_type: x1_bed
sensor_pin: io:adc3
adc_voltage: 1.0
min_temp: 2
max_temp: 120

# The initial feed motor at the cartridge bay (stepper engine 4: step
# GPIO 48, dir 49, driver number 6). Stock runs it with the extruder at
# the same filament speed whenever the extruder runs, cartridge or open
# filament, so it follows the extruder here. LOAD and UNLOAD below take
# it off the extruder for the stretches where stock runs it alone.
[extruder_stepper feed]
extruder: extruder
step_pin: smot_step4
dir_pin: !smot_dir4             # feed = direction bit clear
enable_pin: !gpio50
microsteps: 16
rotation_distance: 14.523       # 220.35 steps/mm (stock ratio to the extruder)

# Bay switch: low while filament runs through the opening port (or a
# cartridge lifts its arm). It releases while the end of the filament is
# still ahead of the gears, so it is the runout sensor (owner 11-21):
# the rest can then be pulled out by a normal UNLOAD_FILAMENT.
[filament_switch_sensor bay]
switch_pin: !gpio80
pause_on_runout: True
runout_gcode:
    M118 Filament ran out at the bay. UNLOAD_FILAMENT, LOAD_FILAMENT, then RESUME

# Low while filament is at the extruder's entry. Only read by the
# routines below.
[filament_switch_sensor extruder_entry]
switch_pin: !gpio120
pause_on_runout: False

[pause_resume]

[force_move]                    # the last stretch of the unload (FORCE_MOVE)
enable_force_move: True

[respond]

# Feed until a sensor changes (klippy/extras/feed_until.py, fork 13f24017 or
# later; klipper/FORK is not moved to it until it has run on a printer):
# the motors are stopped in the micro-controller the moment the sensor
# changes, as in homing. Same pins as the two sensors above.
[feed_until extruder_entry]
pin: !gpio120
steppers: feed, extruder

[feed_until bay]
pin: !gpio80
steppers: feed

# Filament motion pick-ups (klippy/extras/feed_encoder.py in our fork);
# each changes level about once per 0.9 mm of filament. From the
# recordings of 2026-11-21: GPIO 65 sees the filament about 130 mm after
# it has passed the extruder's entry sensor, GPIO 67 sits about 240 mm
# after the bay switch. FEED_UNTIL ENCODER= stops a move with "Filament
# not moving" when the named one stands still for jam_distance.
[feed_encoder head]
pin: gpio65
jam_distance: 30

[feed_encoder bay]
pin: gpio67
jam_distance: 30

[fan]                           # part cooling
pin: io:pwm2

[heater_fan extruder_fan]       # on/off only
pin: io:gpio188
heater: extruder
heater_temp: 50.0

[fan_generic exhaust_right]
pin: io:pwm20

[output_pin exhaust_left]       # on/off only
pin: io:gpio112
value: 0

# Power supply fan (PWM block 10, enable GPIO 127): must run whenever a
# heater is on (owner, twice: stock does the same, 80%). It also runs
# while any motor is enabled, and for a minute after.
[controller_fan psu_fan]
pin: io:pwm10
enable_pin: io:gpio127
hardware_pwm: True
cycle_time: 0.0001
fan_speed: 0.8
idle_timeout: 60
heater: extruder, heater_bed

# Cartridge latch solenoid (stock: on for 10 s after an unload).
[output_pin cartridge_latch]
pin: io:pwm8
value: 0
shutdown_value: 0

[output_pin lamp]
pin: io:pwm7
value: 1
shutdown_value: 0

[output_pin beeper]             # 4 kHz; value = duty, stock 0.36
pin: io:pwm19
pwm: True
hardware_pwm: True
cycle_time: 0.00025
value: 0
shutdown_value: 0

# The speaker (USB sound card + amplifier, played on the stock side by
# install/x1/x1_web.sh "soundd"; the fork's klippy/extras/sindoh_sound.py):
#   PLAY_TONE FREQ=880 MS=200      PLAY_TUNE NOTES="C5:150 E5:150 G5:300"
#   PLAY_SOUND TTS=eng/tts_text_print_usb_1.mp3   (Sindoh's voice files)
#   PLAY_SOUND FILE=name.mp3       (printer_data/config/sounds/)
[sindoh_sound]
volume: 0.5

# Bed leveling: the nozzle is the probe. With the sensor enabled (GPIO
# 153 high), GPIO 81 reads high, and low while the nozzle touches metal.
# It only does that at three notches in the bed sheet, so there is no
# bed mesh: BED_LEVEL (x1_macros.cfg) measures the three notches, as the
# stock firmware does (recorded 2026-11-22: the bed rises at 1.2 mm/s,
# three touches per point). With the sensor disabled GPIO 81 reads low,
# which Klipper takes for "already triggered" and refuses to probe: a
# missing enable cannot drive the bed into the nozzle.
# GPIO 69 (Sindoh's "gp_Nozzle_Voltage_On") is high whenever stock runs,
# and stock writes it in the nozzle change procedure. Its use is not
# known. It is NOT the nozzle touch: with the pin driven low the touch
# at the front left notch still registered, at the same height (-1.30
# against -1.307; 2026-11-27), and the printer homed, heated and printed
# with it as an input. It is held high only because stock holds it so.
[output_pin nozzle_voltage]
pin: gpio69
value: 1
shutdown_value: 0

[output_pin level_sensor_enable]
pin: gpio153
value: 0
shutdown_value: 0

[probe]
pin: !gpio81
z_offset: 0                     # the nozzle itself touches
speed: 1.2                      # stock
lift_speed: 4
samples: 3                      # stock: three touches per point
sample_retract_dist: 2
samples_tolerance: 0.05         # stock's three agree to 0.03 mm
samples_tolerance_retries: 2
activate_gcode:
    SET_PIN PIN=level_sensor_enable VALUE=1
    G4 P300
deactivate_gcode:
    SET_PIN PIN=level_sensor_enable VALUE=0

# ---------------------------------------------------------------------
# Print jobs, web page, touch screen
# ---------------------------------------------------------------------
[virtual_sdcard]
path: /home/klipper/printer_data/gcodes

[display_status]

# Slicer features: per-object cancel and G2/G3 arcs (as on the DP200).
[exclude_object]

[gcode_arcs]
resolution: 0.5

