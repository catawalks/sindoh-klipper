# =====================================================================
# Sindoh 3DWOX 1X (granite2 board, Marvell 88PA6270) - Klipper config
# =====================================================================
# The hardware definition; the macros are in x1_macros.cfg. Both are
# included by printer.cfg and replaced on updates: put your own changes
# in printer.cfg. Same layout as the DP200's dp200_printer.cfg.
#
# Two Klipper MCUs run on the SoC's UPC cores:
#   [mcu]     FM core: stepper engines, endstops
#   [mcu io]  IO core: heaters, fans, thermistors, motor current
#
# STATUS (2026-11-22): stage 6 of the port (docs/1x_port_plan.md). LOADS
# ON THE PRINTER; NO AXIS HAS MOVED UNDER IT YET (X, Y, Z, the extruder
# and the feed motor moved as manual steppers under x1_stage5g.cfg).
# Lines marked CHECK are not confirmed on the machine. Heater limits are
# the low ones the heaters were tested with.
#
# Z homes UPWARD, toward the nozzle: every Z homing asks BED_CLEAR first.
# The chassis is the 2X's. The 1X's single head is the left one; a 2X
# adds a second carriage homing on the right ([dual_carriage]), a second
# extruder, heater block pwm25 and the fan outputs pwm14, pwm22, gpio225.
# =====================================================================

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

