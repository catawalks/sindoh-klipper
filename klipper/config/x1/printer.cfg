# =====================================================================
# Sindoh 3DWOX 1X - YOUR printer.cfg
# =====================================================================
# The hardware definition and the macros come from the two included files,
# which updates replace. This file is yours and is never overwritten:
# - put your own changes and overrides here (a section repeated here adds
#   to / overrides the included one);
# - the per-printer values below are written by calibration commands, then
#   SAVE_CONFIG (which only works for options that are NOT in an include).
# =====================================================================

[include x1_printer.cfg]
[include x1_macros.cfg]

# --- per-printer calibration -----------------------------------------
[stepper_z]
# Z sensor height above the bed. Stock value of the first unit; not
# measured under Klipper yet (CHECK).
position_endstop: 3.1           # CHECK: stock sets 3.1 mm after homing

[extruder]
# Not tuned yet: on/off control as tested. Run
# PID_CALIBRATE HEATER=extruder TARGET=210, then SAVE_CONFIG.
control: watermark

[heater_bed]
# Not tuned yet. Run PID_CALIBRATE HEATER=heater_bed TARGET=60, then
# SAVE_CONFIG.
control: watermark
