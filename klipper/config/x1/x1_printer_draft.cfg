# Sindoh 3DWOX 1X: DRAFT printer config. NEVER LOADED ON THE PRINTER.
#
# This is paper work (2026-11-21): where the 1X port is heading once
# stage 5 of docs/1x_port_plan.md is finished. It collects what has been
# measured into real Klipper sections so the open values are visible.
# Lines marked CHECK are not confirmed on the machine; lines marked
# UNKNOWN are placeholders that must be replaced before any use.
# Tested pieces live in x1_stage4.cfg (inputs), x1_stage5a.cfg (fans,
# lights, beeper) and x1_stage5b.cfg (X, Y, Z as manual steppers).
#
# The chassis is the 2X's. The 1X's single head is the left one; a 2X
# adds a second carriage homing on the right ([dual_carriage]), a second
# extruder, heater block pwm25 and the fan outputs pwm14, pwm22, gpio225.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

[printer]
kinematics: cartesian           # head on X; the bed moves on Y and on Z
max_velocity: 100               # CHECK: step batching is off (one pulse per step)
max_accel: 1000                 # CHECK
max_z_velocity: 5
max_z_accel: 50

# Drivers: TMC222x, 16 microsteps, set up by the stock firmware and kept
# while powered. Klipper has no access to their UART (it is a Linux
# port, tools/x1_tmc.py); current comes from the reference PWM stock
# left running. A cold start without stock will need both.

# X: positive is LEFT, toward the home sensor (stock numbers the same
# way: its X grows to the left). Stock range -3.1 ... 262.7 mm.
[stepper_x]
step_pin: smot_step0
dir_pin: smot_dir0
enable_pin: !gpio164
microsteps: 16
rotation_distance: 40           # 80 steps/mm
endstop_pin: gpio99             # high at home
position_endstop: 262.7         # CHECK: where the sensor trips in stock numbers
position_min: -3.1
position_max: 262.7
homing_speed: 15                # as tested; stock homes faster
homing_positive_dir: True

# Y: the bed. Positive is FORWARD; home is at the back.
[stepper_y]
step_pin: smot_step1
dir_pin: smot_dir1
enable_pin: !gpio170
microsteps: 16
rotation_distance: 39.801       # 80.4 steps/mm
endstop_pin: gpio82             # high at home
position_endstop: 0             # CHECK: stock sets 5.3 mm after homing
position_min: 0
position_max: 200
homing_speed: 15

# Z: the bed. Positive is DOWN; home is at the top, toward the nozzle.
# NEVER home Z with anything on the bed.
[stepper_z]
step_pin: smot_step2
dir_pin: smot_dir2
enable_pin: !gpio38
microsteps: 16
rotation_distance: 1.25         # 2560 steps/mm
endstop_pin: gpio83             # high at home
position_endstop: 3.1           # CHECK: stock sets 3.1 mm after homing
position_min: 0
position_max: 310
homing_speed: 2

# Extruder: stepper engine 3 (step GPIO 42, dir 43, driver number 4,
# spreadCycle), the motor at the rear; the filament runs from it through
# a tube to the nozzle. Driven by Klipper as a manual stepper on
# 2026-11-21 (x1_stage5f.cfg), as was the heater (PWM block 5).
[extruder]
step_pin: smot_step3
dir_pin: !smot_dir3             # feed = direction bit clear
enable_pin: !gpio44
microsteps: 16
rotation_distance: 6.9747       # 458.8 steps/mm (stock, by its engine counter)
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: io:pwm5             # CHECK with low limits first
sensor_type: x1_nozzle
sensor_pin: io:adc1
adc_voltage: 1.0
min_temp: 2
max_temp: 250                   # stock loads at up to 250
control: pid                    # UNKNOWN: placeholders, run PID_CALIBRATE
pid_kp: 20
pid_ki: 1
pid_kd: 100
min_extrude_temp: 170
max_extrude_only_distance: 60   # the load and unload move in 50 mm pieces
max_extrude_only_velocity: 60
max_extrude_only_accel: 800     # CHECK

[heater_bed]
heater_pin: io:pwm28            # CHECK with low limits first
sensor_type: x1_bed
sensor_pin: io:adc2             # select 3 reads the same sensor
adc_voltage: 1.0
min_temp: 2
max_temp: 110
control: watermark              # until PID_CALIBRATE has run

# The initial feed motor at the cartridge bay (stepper engine 4: step
# GPIO 48, dir 49, driver number 6). Stock runs it with the extruder at
# the same filament speed whenever the extruder runs, cartridge or open
# filament, so it follows the extruder here. LOAD and UNLOAD below take
# it off the extruder for the stretches where stock runs it alone.
[extruder_stepper feed]
extruder: extruder
step_pin: smot_step4
dir_pin: !smot_dir4             # feed = direction bit clear
enable_pin: !gpio50
microsteps: 16
rotation_distance: 14.523       # 220.35 steps/mm (stock ratio to the extruder)

# Bay switch: low while filament runs through the opening port (or a
# cartridge lifts its arm). It releases while the end of the filament is
# still ahead of the gears, so it is the runout sensor (owner 11-21):
# the rest can then be pulled out by a normal UNLOAD_FILAMENT.
[filament_switch_sensor bay]
switch_pin: !gpio80
pause_on_runout: True
runout_gcode:
    M118 Filament ran out at the bay. UNLOAD_FILAMENT, LOAD_FILAMENT, then RESUME

# Low while filament is at the extruder's entry. Only read by the
# routines below.
[filament_switch_sensor extruder_entry]
switch_pin: !gpio120
pause_on_runout: False

[pause_resume]

[force_move]                    # moves the feed motor alone (FORCE_MOVE)
enable_force_move: True

[respond]

# The filament motion encoder (GPIO 65 and 67) is not in this draft yet.

# ---------------------------------------------------------------------
# LOAD and UNLOAD, copied from the stock routines as recorded on
# 2026-11-21 (sindoh docs/1x_stock_routines.md). NOT RUN YET.
#   Stock load: initial feed motor alone at 59 mm/s until the filament
#   reaches the extruder (GPIO 120; 412 mm in the recording), both
#   motors 857 mm at 29.7 mm/s, 2 s pause, purge 60 mm at 2 mm/s,
#   retract 18.6 mm. Stock unload: both back at 29.7 mm/s until GPIO 120
#   releases (914 mm), then the initial feed motor alone at 59 mm/s
#   until 4 s after the bay switch releases (789 mm in all).
# Differences from stock: the sensors are read between pieces of a
# move (Klipper has no stop-on-sensor for an extruder), so the feed
# stops and starts every piece and can overrun a sensor by one piece.
# ---------------------------------------------------------------------
[gcode_macro _X1]
variable_park_x: 262.7          # CHECK: the left park, over the dump station
variable_load_temp: 220         # stock PLA: 200 while feeding, 220 for the purge
variable_feed_speed: 59         # initial feed motor alone, mm/s
variable_feed_accel: 500        # CHECK
variable_feed_piece: 20         # mm between looks at the extruder sensor
variable_feed_max: 600          # give up if the extruder sensor has not tripped
variable_both_speed: 29.7       # both motors, mm/s
variable_to_nozzle: 857         # extruder sensor to the nozzle, as stock feeds
variable_purge: 60
variable_purge_speed: 2.0
variable_load_retract: 18.6
variable_piece: 50              # mm per G1 (max_extrude_only_distance is 60)
variable_unload_max: 1100       # give up if the extruder sensor has not released
variable_bay_max: 900           # give up if the bay switch has not released
variable_bay_extra: 240         # stock runs on about 4 s after the bay switch
gcode:

[gcode_macro _X1_PARK]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% if 'x' not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    G90
    G1 X{c.park_x} F3000

[gcode_macro _X1_FEED_ALONE]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=feed MOTION_QUEUE=

[gcode_macro _X1_FEED_WITH_EXTRUDER]
gcode:
    M400
    SYNC_EXTRUDER_MOTION EXTRUDER=feed MOTION_QUEUE=extruder

[gcode_macro _X1_FAIL]
gcode:
    {action_raise_error(params.MSG|default("stopped"))}

[gcode_macro LOAD_FILAMENT]
description: Load filament pushed in through the opening port, purge over the dump station. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    {% if not printer["filament_switch_sensor bay"].filament_detected %}
        {action_raise_error("LOAD_FILAMENT: push the filament in through the opening port until the bay switch trips, then run it again")}
    {% endif %}
    _X1_PARK
    M109 S{temp}
    _X1_FEED_ALONE
    {% for i in range((c.feed_max / c.feed_piece)|round(0, 'ceil')|int) %}
        _X1_FEED_TO_EXTRUDER
    {% endfor %}
    _X1_FEED_WITH_EXTRUDER
    _X1_LOAD_REST PREV={prev}

# One piece toward the extruder, unless the filament is already there.
[gcode_macro _X1_FEED_TO_EXTRUDER]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    M400
    {% if not printer["filament_switch_sensor extruder_entry"].filament_detected %}
        FORCE_MOVE STEPPER="extruder_stepper feed" DISTANCE={c.feed_piece} VELOCITY={c.feed_speed} ACCEL={c.feed_accel}
    {% endif %}

[gcode_macro _X1_LOAD_REST]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set n = (c.to_nozzle / c.piece)|round(0, 'ceil')|int %}
    {% if not printer["filament_switch_sensor extruder_entry"].filament_detected %}
        M104 S{params.PREV|default(0)|float}
        _X1_FAIL MSG="LOAD_FILAMENT stopped: the filament did not reach the extruder. UNLOAD_FILAMENT and try again"
    {% endif %}
    M83
    {% for i in range(n) %}
        G1 E{c.to_nozzle / n} F{c.both_speed * 60}
    {% endfor %}
    G4 P2000
    G1 E{c.purge} F{c.purge_speed * 60}
    G1 E-{c.load_retract} F{c.both_speed * 60}
    M400
    M104 S{params.PREV|default(0)|float}
    M118 Load complete

[gcode_macro UNLOAD_FILAMENT]
description: Pull the filament back out of the opening port. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    _X1_PARK
    M109 S{temp}
    M83
    {% for i in range((c.unload_max / c.piece)|round(0, 'ceil')|int) %}
        _X1_BACK_FROM_EXTRUDER
    {% endfor %}
    M400
    M104 S{prev}
    _X1_UNLOAD_REST

# One piece back with both motors, while filament is at the extruder.
[gcode_macro _X1_BACK_FROM_EXTRUDER]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    M400
    {% if printer["filament_switch_sensor extruder_entry"].filament_detected %}
        G1 E-{c.piece} F{c.both_speed * 60}
    {% endif %}

[gcode_macro _X1_UNLOAD_REST]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% if printer["filament_switch_sensor extruder_entry"].filament_detected %}
        _X1_FAIL MSG="UNLOAD_FILAMENT stopped: filament is still at the extruder"
    {% endif %}
    _X1_FEED_ALONE
    {% for i in range((c.bay_max / c.piece)|round(0, 'ceil')|int) %}
        _X1_BACK_FROM_BAY
    {% endfor %}
    _X1_UNLOAD_END

# One piece back with the initial feed motor alone, while the bay
# switch still sees filament.
[gcode_macro _X1_BACK_FROM_BAY]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    M400
    {% if printer["filament_switch_sensor bay"].filament_detected %}
        FORCE_MOVE STEPPER="extruder_stepper feed" DISTANCE=-{c.piece} VELOCITY={c.feed_speed} ACCEL={c.feed_accel}
    {% endif %}

[gcode_macro _X1_UNLOAD_END]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    M400
    {% if printer["filament_switch_sensor bay"].filament_detected %}
        _X1_FEED_WITH_EXTRUDER
        _X1_FAIL MSG="UNLOAD_FILAMENT stopped: the bay switch still sees filament"
    {% endif %}
    FORCE_MOVE STEPPER="extruder_stepper feed" DISTANCE=-{c.bay_extra} VELOCITY={c.feed_speed} ACCEL={c.feed_accel}
    _X1_FEED_WITH_EXTRUDER
    M118 Unload complete - pull the filament out of the opening port

[fan]                           # part cooling
pin: io:pwm2

[heater_fan extruder_fan]       # on/off only
pin: io:gpio188
heater: extruder
heater_temp: 50.0

[fan_generic exhaust_right]
pin: io:pwm20

[output_pin exhaust_left]       # on/off only
pin: io:gpio112
value: 0

# The power supply fan (pwm10, enable gpio127) is left as stock set it.
# It must run whenever a heater can be on (owner); a cold start without
# stock has to switch it on itself.

[output_pin lights]
pin: io:pwm7
value: 1
shutdown_value: 0

[output_pin beeper]             # 4 kHz; value = duty, stock 0.36
pin: io:pwm19
pwm: True
hardware_pwm: True
cycle_time: 0.00025
value: 0
shutdown_value: 0

# Bed leveling: the nozzle is the probe (GPIO 81 changes on contact).
# Stock first switches on GPIO 153 (sensor enable) and GPIO 69 (a
# voltage on the nozzle), wipes the nozzle on the bed's edge strip and
# measures at 150 C. Sketch only; nothing of this has been tried:
#[output_pin level_sensor_enable]
#pin: gpio153
#[probe]
#pin: gpio81                    # CHECK polarity
#z_offset: 0
#[screws_tilt_adjust]           # stock's three points; one click = 45 degrees

# Thermistor tables x1_nozzle and x1_bed: copy from x1_stage4.cfg.
