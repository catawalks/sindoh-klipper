# Sindoh 3DWOX 1X: DRAFT printer config. NEVER LOADED ON THE PRINTER.
#
# This is paper work (2026-11-21): where the 1X port is heading once
# stage 5 of docs/1x_port_plan.md is finished. It collects what has been
# measured into real Klipper sections so the open values are visible.
# Lines marked CHECK are not confirmed on the machine; lines marked
# UNKNOWN are placeholders that must be replaced before any use.
# Tested pieces live in x1_stage4.cfg (inputs), x1_stage5a.cfg (fans,
# lights, beeper) and x1_stage5b.cfg (X, Y, Z as manual steppers).
#
# The chassis is the 2X's. The 1X's single head is the left one; a 2X
# adds a second carriage homing on the right ([dual_carriage]), a second
# extruder, heater block pwm25 and the fan outputs pwm14, pwm22, gpio225.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

[printer]
kinematics: cartesian           # head on X; the bed moves on Y and on Z
max_velocity: 100               # CHECK: step batching is off (one pulse per step)
max_accel: 1000                 # CHECK
max_z_velocity: 5
max_z_accel: 50

# Drivers: TMC222x, 16 microsteps, set up by the stock firmware and kept
# while powered. Klipper has no access to their UART (it is a Linux
# port, tools/x1_tmc.py); current comes from the reference PWM stock
# left running. A cold start without stock will need both.

# X: positive is LEFT, toward the home sensor (stock numbers the same
# way: its X grows to the left). Stock range -3.1 ... 262.7 mm.
[stepper_x]
step_pin: smot_step0
dir_pin: smot_dir0
enable_pin: !gpio164
microsteps: 16
rotation_distance: 40           # 80 steps/mm
endstop_pin: gpio99             # high at home
position_endstop: 262.7         # CHECK: where the sensor trips in stock numbers
position_min: -3.1
position_max: 262.7
homing_speed: 15                # as tested; stock homes faster
homing_positive_dir: True

# Y: the bed. Positive is FORWARD; home is at the back.
[stepper_y]
step_pin: smot_step1
dir_pin: smot_dir1
enable_pin: !gpio170
microsteps: 16
rotation_distance: 39.801       # 80.4 steps/mm
endstop_pin: gpio82             # high at home
position_endstop: 0             # CHECK: stock sets 5.3 mm after homing
position_min: 0
position_max: 200
homing_speed: 15

# Z: the bed. Positive is DOWN; home is at the top, toward the nozzle.
# NEVER home Z with anything on the bed.
[stepper_z]
step_pin: smot_step2
dir_pin: smot_dir2
enable_pin: !gpio38
microsteps: 16
rotation_distance: 1.25         # 2560 steps/mm
endstop_pin: gpio83             # high at home
position_endstop: 3.1           # CHECK: stock sets 3.1 mm after homing
position_min: 0
position_max: 310
homing_speed: 2

# Extruder: stepper engine 3 (step GPIO 42, dir 43, driver number 4,
# spreadCycle). Not driven by Klipper yet. Heater: PWM block 5, worked
# out from a recorded stock load, not driven by Klipper yet.
[extruder]
step_pin: smot_step3
dir_pin: smot_dir3
enable_pin: !gpio44             # CHECK: by the pin pattern
microsteps: 16
rotation_distance: 7.5          # UNKNOWN: placeholder, measure before use
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: io:pwm5             # CHECK with low limits first
sensor_type: x1_nozzle
sensor_pin: io:adc1
adc_voltage: 1.0
min_temp: 2
max_temp: 250                   # stock loads at up to 250
control: pid                    # UNKNOWN: placeholders, run PID_CALIBRATE
pid_kp: 20
pid_ki: 1
pid_kd: 100
min_extrude_temp: 170

[heater_bed]
heater_pin: io:pwm28            # CHECK with low limits first
sensor_type: x1_bed
sensor_pin: io:adc2             # select 3 reads the same sensor
adc_voltage: 1.0
min_temp: 2
max_temp: 110
control: watermark              # until PID_CALIBRATE has run

# The cartridge feed motor (stepper engine 4: step GPIO 48, dir 49,
# enable 50 by the pattern, driver number 6) and the filament motion
# encoder (GPIO 65 and 67) are not in this draft yet.

[fan]                           # part cooling
pin: io:pwm2

[heater_fan extruder_fan]       # on/off only
pin: io:gpio188
heater: extruder
heater_temp: 50.0

[fan_generic exhaust_right]
pin: io:pwm20

[output_pin exhaust_left]       # on/off only
pin: io:gpio112
value: 0

# The power supply fan (pwm10, enable gpio127) is left as stock set it.
# It must run whenever a heater can be on (owner); a cold start without
# stock has to switch it on itself.

[output_pin lights]
pin: io:pwm7
value: 1
shutdown_value: 0

[output_pin beeper]             # 4 kHz; value = duty, stock 0.36
pin: io:pwm19
pwm: True
hardware_pwm: True
cycle_time: 0.00025
value: 0
shutdown_value: 0

# Bed leveling: the nozzle is the probe (GPIO 81 changes on contact).
# Stock first switches on GPIO 153 (sensor enable) and GPIO 69 (a
# voltage on the nozzle), wipes the nozzle on the bed's edge strip and
# measures at 150 C. Sketch only; nothing of this has been tried:
#[output_pin level_sensor_enable]
#pin: gpio153
#[probe]
#pin: gpio81                    # CHECK polarity
#z_offset: 0
#[screws_tilt_adjust]           # stock's three points; one click = 45 degrees

# Thermistor tables x1_nozzle and x1_bed: copy from x1_stage4.cfg.
