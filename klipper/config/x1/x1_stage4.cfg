# Sindoh 3DWOX 1X: stage 4 of the port (docs/1x_port_plan.md).
# LOOK ONLY: thermistors and a few inputs. No heater, fan, motor or other
# output is defined here, so Klipper cannot switch anything.
# Started by install/x1/x1_stage4.sh; not a printer config yet.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

