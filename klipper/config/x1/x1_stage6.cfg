# Sindoh 3DWOX 1X: stage 6 of the port (docs/1x_port_plan.md), the first
# real printer config: X, Y and Z as axes with homing, both heaters, the
# filament routines, and what Moonraker, Mainsail and the touch screen
# need (print job objects). Made from x1_printer_draft.cfg on 2026-11-21.
# LOADS ON THE PRINTER; NO AXIS HAS MOVED UNDER IT YET. Lines marked
# CHECK are not confirmed on the machine. Heater limits are the low ones
# the heaters were tested with (x1_stage5g.cfg).
# Started by install/x1/x1_stage4.sh start x1_stage6.cfg.
#
# Z homes UPWARD, toward the nozzle: every Z homing asks BED_CLEAR first.
# The chassis is the 2X's. The 1X's single head is the left one; a 2X
# adds a second carriage homing on the right ([dual_carriage]), a second
# extruder, heater block pwm25 and the fan outputs pwm14, pwm22, gpio225.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

