# Sindoh 3DWOX 1X: stage 5e of the port (docs/1x_port_plan.md).
# Stage 5d: as stage 5c (both heaters, confirmed 2026-11-21: PWM 5 is the
# nozzle, 28 the bed) with the nozzle allowed to printing temperature, plus
# the extruder motor and the three axes as manual steppers.
# Started by install/x1/x1_stage4.sh start x1_stage5e.cfg; not a printer config yet.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

