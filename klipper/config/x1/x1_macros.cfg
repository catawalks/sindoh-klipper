# =====================================================================
# Sindoh 3DWOX 1X macros
# =====================================================================
# Filament load and unload as the stock firmware does them, the macros
# the touch screen shares by name with the DP200 (dp200_macros.cfg), and
# the Z homing guard. Sources: sindoh docs/1x_stock_routines.md and this
# printer's karas.db.
#
# Included by printer.cfg (next to x1_printer.cfg). Replaced on updates.
# =====================================================================

# ---------------------------------------------------------------------
# LOAD and UNLOAD, copied from the stock routines as recorded on
# 2026-11-21 (sindoh docs/1x_stock_routines.md). Run under x1_stage5g.cfg.
#   Stock load: initial feed motor alone at 59 mm/s until the filament
#   reaches the extruder (GPIO 120; 412 mm in the recording), both
#   motors 857 mm at 29.7 mm/s, 2 s pause, purge 60 mm at 2 mm/s,
#   retract 18.6 mm. Stock unload: both back at 29.7 mm/s until GPIO 120
#   releases (914 mm), then the initial feed motor alone at 59 mm/s
#   until 4 s after the bay switch releases (789 mm in all).
# Jam check (owner 11-21): every stretch watches a pick-up where the
# filament is known to be on it; JAM_AFTER / JAM_UNTIL are that window.
# ---------------------------------------------------------------------
[gcode_macro _X1]
variable_park_x: 256.4          # stock load position, over the dump station (the left end is 262.7, the home sensor's edge 243.4)
variable_after_x: 243.4         # stock moves here after the purge
variable_clean_temp: 200        # stock PLA cleaning temperature
variable_clean_x1: 257.3        # stock wipe, between these two X
variable_clean_x2: 231.3
variable_clean_z: 10.0
variable_clean_wipes: 2
variable_clean_wipe_speed: 50   # CHECK
variable_clean_purge: 20        # CHECK: stock "pushes some filament"
variable_clean_retract: 5       # CHECK
variable_dry_z: 150             # dryer: the bed goes down to here
variable_home_off_x: -25        # move off the X home sensor (away from home = lower X)
variable_home_off_y: 11         # move off the Y home sensor (bed comes forward)
variable_load_temp: 220         # stock PLA: 200 while feeding, 220 for the purge
variable_feed_speed: 59         # initial feed motor alone, mm/s
variable_feed_accel: 500        # CHECK
variable_feed_max: 600          # give up if the extruder sensor has not tripped
variable_both_speed: 29.7       # both motors, mm/s
variable_to_nozzle: 857         # extruder sensor to the nozzle, as stock feeds
variable_hot_part: 150          # CHECK: the last stretch of it, fed only at temperature
variable_purge: 60
variable_purge_speed: 2.0
variable_load_retract: 18.6
variable_unload_max: 1100       # give up if the extruder sensor has not released
variable_bay_max: 900           # give up if the bay switch has not released
variable_bay_extra: 240         # stock runs on about 4 s after the bay switch
variable_head_after: 160        # CHECK: load, mm past the entry sensor before GPIO 65 must move
variable_head_until: 600        # CHECK: unload, GPIO 65 is watched for this many mm
variable_bay_until: 150         # CHECK: unload, GPIO 67 is watched for this many mm
gcode:

[gcode_macro _SINDOH_PARK]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% if 'x' not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    G90
    G1 X{c.park_x} F3000

[gcode_macro _SINDOH_AFTER_LOAD]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    G90
    G1 X{c.after_x} F3000

[gcode_macro LOAD_FILAMENT]
description: Load filament pushed in through the opening port, purge over the dump station. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    {% if not printer["filament_switch_sensor bay"].filament_detected %}
        {action_raise_error("LOAD_FILAMENT: push the filament in through the opening port until the bay switch trips, then run it again")}
    {% endif %}
    _SINDOH_PARK
    M104 S{temp}
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed STATE=1 DISTANCE={c.feed_max} SPEED={c.feed_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=bay JAM_AFTER=30
    # most of the way while the nozzle heats (owner 11-21); every stretch
    # stops if the filament leaves the entry sensor or stands still
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE={c.to_nozzle - c.hot_part} SPEED={c.both_speed} ACCEL={c.feed_accel} FORBID=1 COLD=1 ENCODER=head JAM_AFTER={c.head_after}
    M109 S{temp}
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE={c.hot_part} SPEED={c.both_speed} ACCEL={c.feed_accel} FORBID=1 ENCODER=head
    M83
    G4 P2000
    G1 E{c.purge} F{c.purge_speed * 60}
    G1 E-{c.load_retract} F{c.both_speed * 60}
    M400
    M104 S{prev}
    _SINDOH_AFTER_LOAD
    M118 Load complete

[gcode_macro UNLOAD_FILAMENT]
description: Pull the filament back out of the opening port. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    _SINDOH_PARK
    M109 S{temp}
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE=-{c.unload_max} SPEED={c.both_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=head JAM_UNTIL={c.head_until}
    M104 S{prev}
    FEED_UNTIL SENSOR=bay STEPPERS=feed STATE=0 DISTANCE=-{c.bay_max} SPEED={c.feed_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=bay JAM_UNTIL={c.bay_until}
    FORCE_MOVE STEPPER="extruder_stepper feed" DISTANCE=-{c.bay_extra} VELOCITY={c.feed_speed} ACCEL={c.feed_accel}
    M118 Unload complete - pull the filament out of the opening port

# ---------------------------------------------------------------------
# Macros the touch screen and the DP200 config share by name. Written
# 2026-11-22 from the stock numbers and the DP200's macros; NONE OF THEM
# HAS RUN ON A 1X. The screen greys out a button whose macro is missing.
# Still to write: EMPTY_BIN, the leveling macro, PRINT_START / PRINT_END.
# ---------------------------------------------------------------------
[gcode_macro _SINDOH_ENSURE_HOMED]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

[gcode_macro _SINDOH_ENSURE_HOMED_XY]
gcode:
    {% if 'x' not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    {% if 'y' not in printer.toolhead.homed_axes %}
        G28 Y
    {% endif %}

# Stock nozzle cleaning (database, this printer): heat to 200 C (PLA),
# push some filament out over the dump station, wipe between X 257.3 and
# 231.3 twice at Z 10, retract. Z is only moved if it is homed.
[gcode_macro CLEAN_NOZZLE]
description: Purge over the dump station and wipe the nozzle (stock routine). TEMP= (default 200), PURGE=0 to wipe only
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.clean_temp)|float %}
    _SINDOH_ENSURE_HOMED_XY
    SAVE_GCODE_STATE NAME=clean_nozzle
    G90
    {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < c.clean_z %}
        G1 Z{c.clean_z} F300
    {% endif %}
    G1 X{c.park_x} F3000
    M109 S{temp}
    {% if params.PURGE|default(1)|int %}
        M83
        G1 E{c.clean_purge} F{c.purge_speed * 60}
        G1 E-{c.clean_retract} F{c.both_speed * 60}
        G4 P2000
    {% endif %}
    G1 X{c.clean_x1} F3000
    {% for i in range(c.clean_wipes) %}
        G1 X{c.clean_x2} F{c.clean_wipe_speed * 60}
        G1 X{c.clean_x1} F{c.clean_wipe_speed * 60}
    {% endfor %}
    G1 X{c.park_x} F3000
    M104 S{prev}
    RESTORE_GCODE_STATE NAME=clean_nozzle

# Filament dryer: the DP200's (bed as the heat source, spool lying flat).
[gcode_macro _DRY]
variable_active: 0
variable_remaining: 0         # minutes left
variable_total: 0             # minutes
variable_temp: 0
variable_flipped: 0
variable_sheet_max: 70        # build sheet's continuous rating (C)
variable_vent_every: 15       # minutes between vents (exhaust fan 1 min)
gcode:

[gcode_macro FILAMENT_DRY]
description: Dry a spool on the bed. TEMP= (C) HOURS= [MATERIAL=] [FORCE=1 above the sheet limit]
gcode:
    {% set d = printer["gcode_macro _DRY"] %}
    {% set temp = params.TEMP|default(50)|float %}
    {% set hours = params.HOURS|default(4)|float %}
    {% set limit = printer.configfile.settings.heater_bed.max_temp|float %}
    {% if printer.print_stats.state in ('printing', 'paused') %}
        {action_raise_error("FILAMENT_DRY: a print is running")}
    {% elif temp < 35 or temp > limit %}
        {action_raise_error("FILAMENT_DRY: TEMP must be 35..%d C" % limit)}
    {% elif temp > d.sheet_max and params.FORCE|default(0)|int != 1 %}
        {action_raise_error("FILAMENT_DRY: %d C is above the build sheet's %d C limit - add FORCE=1 if your sheet is rated for it" % (temp, d.sheet_max))}
    {% elif hours <= 0 or hours > 24 %}
        {action_raise_error("FILAMENT_DRY: HOURS must be 0..24")}
    {% endif %}
    {% set c = printer["gcode_macro _X1"] %}
    {% set th = printer.toolhead %}
    M104 S0
    _SINDOH_ENSURE_HOMED
    G90
    G1 Z{c.dry_z} F300                          # bed down: room for a spool lying flat
    G1 X{c.park_x} Y{th.axis_maximum.y} F6000   # head off the bed, bed forward to the door
    {% set mins = (hours * 60)|int %}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=remaining VALUE={mins}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=total VALUE={mins}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=flipped VALUE=0
    # idle_timeout would turn the bed off after 10 min without G-code
    SET_IDLE_TIMEOUT TIMEOUT={mins * 60 + 900}
    M140 S{temp}
    UPDATE_DELAYED_GCODE ID=_DRY_TICK DURATION=60
    M118 Drying {params.MATERIAL|default('filament')}: bed {temp|int} C for {hours} h. Put the spool on the bed lying flat and close the doors.

[delayed_gcode _DRY_TICK]
gcode:
    {% set d = printer["gcode_macro _DRY"] %}
    {% if d.active %}
        {% set left = d.remaining - 1 %}
        SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=remaining VALUE={left}
        {% if left <= 0 %}
            _DRY_DONE
        {% else %}
            M140 S{d.temp}                     # in case something turned it off
            {% if (d.total - left) % d.vent_every == 0 %}
                SET_FAN_SPEED FAN=exhaust_right SPEED=0.6
            {% else %}
                SET_FAN_SPEED FAN=exhaust_right SPEED=0
            {% endif %}
            {% if not d.flipped and left <= d.total // 2 %}
                SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=flipped VALUE=1
                M118 Drying: halfway - flip the spool over for even drying
                _DRY_SIGNAL N=2
            {% endif %}
            UPDATE_DELAYED_GCODE ID=_DRY_TICK DURATION=60
        {% endif %}
    {% endif %}

[gcode_macro _DRY_DONE]
gcode:
    _DRY_OFF
    M118 Drying finished - take the spool out (the bed is still warm)
    _DRY_SIGNAL N=5

[gcode_macro FILAMENT_DRY_STOP]
description: Stop the filament dryer (bed off)
gcode:
    {% if printer["gcode_macro _DRY"].active %}
        _DRY_OFF
        M118 Drying stopped
    {% endif %}

[gcode_macro _DRY_OFF]
gcode:
    {% set idle = printer.configfile.settings.idle_timeout %}
    UPDATE_DELAYED_GCODE ID=_DRY_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=remaining VALUE=0
    M140 S0
    SET_FAN_SPEED FAN=exhaust_right SPEED=0
    SET_IDLE_TIMEOUT TIMEOUT={idle.timeout if idle is defined else 600}

# M300 [P<ms>]: one beep (default 120 ms, the stock single beep) at the
# stock 4 kHz. S<Hz> is accepted and ignored: the firmware sets the pitch.
# Volume = the beeper's duty (stock levels 0.03 / 0.06 / 0.36).
[gcode_macro M300]
variable_volume: 0.36
gcode:
    {% if 'output_pin beeper' in printer %}
        SET_PIN PIN=beeper VALUE={printer["gcode_macro M300"].volume}
        G4 P{params.P|default(120)|int}
        SET_PIN PIN=beeper VALUE=0
    {% endif %}

# Lamp flashes N times, plus the beeper when [output_pin beeper] exists.
[gcode_macro _DRY_SIGNAL]
gcode:
    {% set lamp = printer["output_pin lamp"].value %}
    {% set beep = 'output_pin beeper' in printer %}
    {% for i in range(params.N|default(3)|int) %}
        SET_PIN PIN=lamp VALUE=0
        {% if beep %}
            SET_PIN PIN=beeper VALUE={printer["gcode_macro M300"].volume}
        {% endif %}
        G4 P400
        SET_PIN PIN=lamp VALUE=1
        {% if beep %}
            SET_PIN PIN=beeper VALUE=0
        {% endif %}
        G4 P400
    {% endfor %}
    SET_PIN PIN=lamp VALUE={lamp}

# ---------------------------------------------------------------------
# Idle timeout of the touch screen (SYSTEM -> DISPLAY -> TIMEOUT sets the
# time). The screen program runs SCREEN_TIMEOUT when the printer has been
# idle and untouched that long, and SCREEN_WAKE at the next touch (or when
# a print or heating starts). What goes dark is set here; to change it,
# repeat the section in printer.cfg with only the lines to change, e.g.
#   [gcode_macro SCREEN_TIMEOUT]
#   variable_lamp: 0
# For anything else, replace the two macros in printer.cfg.
# ---------------------------------------------------------------------
[gcode_macro SCREEN_TIMEOUT]
description: Run by the touch screen when its idle timeout ends
variable_display: 1             # 1: the screen goes black (read by the screen program)
variable_lamp: 1                # 1: the case lamp goes off
variable_lamp_was: 0
gcode:
    {% set v = printer["output_pin lamp"].value %}
    {% if lamp and v > 0 %}
        SET_GCODE_VARIABLE MACRO=SCREEN_TIMEOUT VARIABLE=lamp_was VALUE={v}
        SET_PIN PIN=lamp VALUE=0
    {% endif %}

[gcode_macro SCREEN_WAKE]
description: Run by the touch screen when it wakes from its idle timeout
gcode:
    {% set was = printer["gcode_macro SCREEN_TIMEOUT"].lamp_was %}
    {% if was > 0 and printer["output_pin lamp"].value == 0 %}
        SET_PIN PIN=lamp VALUE={was}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SCREEN_TIMEOUT VARIABLE=lamp_was VALUE=0

[gcode_macro LAMP_TOGGLE]
description: Switch the chamber light on or off (the touch screen's LAMP button)
gcode:
    SET_PIN PIN=lamp VALUE={0 if printer["output_pin lamp"].value > 0 else 1}

# Z homes upward to a sensor near the nozzle: anything on the bed is
# crushed (DP200, 2026-10-28). Every Z homing needs BED_CLEAR first; one
# BED_CLEAR allows one Z homing within 5 minutes.
[homing_override]
axes: xyz
gcode:
    {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if (all or 'Z' in params) and not printer["gcode_macro BED_CLEAR"].ok %}
        _BED_CLEAR_ASK
        _BED_CLEAR_FAIL
    {% endif %}
    QUERY_ENDSTOPS
    {% if all or 'X' in params %}
        _SINDOH_HOME_AXIS AXIS=X
    {% endif %}
    {% if all or 'Y' in params %}
        _SINDOH_HOME_AXIS AXIS=Y
    {% endif %}
    {% if all or 'Z' in params %}
        G28 Z
        SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=0
    {% endif %}

# X and Y as stock homes them: an axis that is already on its home
# sensor first moves off it by a set distance, then homes. The sensors
# stay on from their edge all the way to the end of travel (X: 19.3 mm,
# with the dump station inside it; Y: 5.8 mm; measured 2026-11-22), so
# Klipper's own short back-off cannot clear them. home_off_x /
# home_off_y in _X1 are that stretch plus 5 mm. (No digit in the name:
# Klipper cannot pass parameters to a command with one.)
[gcode_macro _SINDOH_HOME_AXIS]
gcode:
    {% set a = params.AXIS|lower %}
    {% set c = printer["gcode_macro _X1"] %}
    {% if printer.query_endstops.last_query[a] %}
        FORCE_MOVE STEPPER=stepper_{a} DISTANCE={c.home_off_x if a == 'x' else c.home_off_y} VELOCITY=15 ACCEL=500
    {% endif %}
    G28 {a|upper}

[gcode_macro BED_CLEAR]
description: Confirm the bed is empty so Z may home (CANCEL=1 to decline)
variable_ok: 0
variable_asking: 0
gcode:
    SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=asking VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if params.CANCEL|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=0
        M118 Homing cancelled - clear the bed first
    {% else %}
        SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=1
        UPDATE_DELAYED_GCODE ID=_BED_CLEAR_EXPIRE DURATION=300
        M118 Bed confirmed empty - one Z homing allowed in the next 5 min (repeat a refused command)
    {% endif %}

[delayed_gcode _BED_CLEAR_EXPIRE]
gcode:
    SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=0

[gcode_macro _BED_CLEAR_ASK]
gcode:
    SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=asking VALUE=1
    RESPOND TYPE=command MSG="action:prompt_begin Is the bed empty?"
    RESPOND TYPE=command MSG="action:prompt_text Homing Z raises the bed to the top. Anything on it gets crushed against the head."
    RESPOND TYPE=command MSG="action:prompt_footer_button NO|BED_CLEAR CANCEL=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button YES, EMPTY|BED_CLEAR|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _BED_CLEAR_FAIL]
gcode:
    {action_raise_error("Is the bed empty? Homing Z raises the bed to the top. Confirm with BED_CLEAR (screen: YES), then try again.")}


