# =====================================================================
# Sindoh 3DWOX 1X macros
# =====================================================================
# Filament load and unload as the stock firmware does them, the macros
# the touch screen shares by name with the DP200 (dp200_macros.cfg), and
# the Z homing guard. Sources: sindoh docs/1x_stock_routines.md and this
# printer's karas.db.
#
# Included by printer.cfg (next to x1_printer.cfg). Replaced on updates.
# =====================================================================

# ---------------------------------------------------------------------
# LOAD and UNLOAD, copied from the stock routines as recorded on
# 2026-11-21 (sindoh docs/1x_stock_routines.md). Run under x1_stage5g.cfg.
#   Stock load: initial feed motor alone at 59 mm/s until the filament
#   reaches the extruder (GPIO 120; 412 mm in the recording), both
#   motors 857 mm at 29.7 mm/s, 2 s pause, purge 60 mm at 2 mm/s,
#   retract 18.6 mm. Stock unload: both back at 29.7 mm/s until GPIO 120
#   releases (914 mm), then the initial feed motor alone at 59 mm/s
#   until 4 s after the bay switch releases (789 mm in all).
# Jam check (owner 11-21): every stretch watches a pick-up where the
# filament is known to be on it; JAM_AFTER / JAM_UNTIL are that window.
# ---------------------------------------------------------------------
[gcode_macro _X1]
# The dump station (X grows to the LEFT; stock's numbers, confirmed by
# the move-by-move recording of 2026-11-22, sindoh docs/1x_stock_routines.md):
#   262.7  the left wall, where the head rests after stock's homing
#   253.5  the tall left flap: not for cleaning, it folds over under
#          the nozzle when the head is at rest (a cap against dripping)
#   247.8  stock's purge position, the bin's center (owner: 246.5 - 247.5)
#   242.4  the home sensor's edge (on from here to the wall)
#   237.5  the cleaning flap (the right one); the nozzle lets go of it
#          at 250 moving left and at 225.5 moving right
# This is the LEFT head's station, the 1X's only one. The 2X has a second
# head at the right end (below X 0) with its own bin, flaps and purge
# count: give it its own set of these values, do not reuse these.
variable_park_x: 247.8          # purge here (load, cleaning); unload waits here too
variable_park_via_x: 252.8      # stock comes to it from the left: here first, then 5 mm back
variable_clean_temp: 200        # stock PLA cleaning temperature
variable_clean_x1: 252.8        # stock wipes across the cleaning flap between these two X,
variable_clean_x2: 226.8        # after a first move left to the wall that cuts the purged strand
variable_clean_z: 10.0
variable_clean_wipes: 2
variable_clean_wipe_speed: 45   # stock: a 26 mm pass in 0.66 s
variable_clean_purge: 20        # CHECK: stock "pushes some filament"
variable_clean_retract: 5       # CHECK
variable_dry_z: 150             # dryer: the bed goes down to here
variable_home_off_x: -35        # move off the X home sensor first, as stock (away from home = lower X)
variable_home_off_y: 10         # move off the Y home sensor first, as stock (bed comes forward)
variable_level_temp: 150        # stock measures with the nozzle at 150 C
variable_level_travel_z: 3      # between the points (stock: about 3.4 mm clear)
variable_level_back_x: 111.5    # the three notches, as stock probes them (recorded 2026-11-22):
variable_level_back_y: 200.2    #   back (the fixed support),
variable_level_fl_x: 228.5      #   front left (a wheel),
variable_level_fl_y: 0.2
variable_level_fr_x: -7.5       #   front right (a wheel)
variable_level_fr_y: 0.2
variable_scrub_depth: 1.3       # the scrub raises the bed this far past the print surface (Z 0),
                                # pressing the sheet against the nozzle on the bed's springs.
                                # Stock goes to about 1.7 (3.83 mm above the Z sensor's trip
                                # point); a little less by the owner's choice, 2026-11-22
variable_load_temp: 220         # stock PLA: 200 while feeding, 220 for the purge
variable_feed_speed: 59         # initial feed motor alone, mm/s
variable_feed_accel: 500        # CHECK
variable_feed_max: 600          # give up if the extruder sensor has not tripped
variable_both_speed: 29.7       # both motors, mm/s
variable_to_nozzle: 854.5       # both motors after the extruder sensor, as stock feeds
variable_hot_part: 150          # the last stretch of it, fed only at temperature (stock feeds all of it
                                # at once: its nozzle idles at 80 C; ours may start cold)
variable_purge: 60
variable_purge_speed: 1.98
variable_load_retract: 20        # stock, after a 0.5 s pause; then 3 s before the wipe
variable_retract_speed: 38
variable_load_fan: 0.5          # part fan during load and unload, as stock
variable_unload_slow: 50        # unload: the first stretch at unload_slow_speed (stock: 5 s)
variable_unload_slow_speed: 10
variable_bin_park_x: 132.4      # EMPTY_BIN: stock parks the left head here, just left of the
                                # centerline (2X: the right head goes just right of it)
variable_bin_z: 90              # EMPTY_BIN: bed down to here (owner 11-22; stock goes to about 121)
variable_bin_threshold: 15      # purges before the screen asks to empty the bin (owner 11-22:
                                # 15 for now, maybe more; stock never asks on the 1X). Change
                                # it in printer.cfg if you catch the purges some other way
variable_unload_max: 1100       # give up if the extruder sensor has not released
variable_bay_max: 900           # give up if the bay switch has not released
variable_bay_extra: 240         # stock runs on about 4 s after the bay switch
variable_head_after: 160        # CHECK: load, mm past the entry sensor before GPIO 65 must move
variable_head_until: 600        # CHECK: unload, GPIO 65 is watched for this many mm
variable_bay_until: 150         # CHECK: unload, GPIO 67 is watched for this many mm
gcode:

[gcode_macro _SINDOH_PARK]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% if 'x' not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    G90
    # To the bin's center from the LEFT, as stock does (and owner
    # 2026-11-22): coming from the right, the cleaning flap stays folded
    # over under the heater block.
    G1 X{c.park_via_x} F3000
    G1 X{c.park_x} F3000

# Stock's wipe after a purge: left to the wall (this cuts the purged
# strand off the nozzle), then across the cleaning flap and back,
# clean_wipes times, and back to the bin's center from the left.
[gcode_macro _SINDOH_WIPE]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set f = c.clean_wipe_speed * 60 %}
    G90
    G1 X{printer.toolhead.axis_maximum.x} F{f}
    {% for i in range(c.clean_wipes) %}
        G1 X{c.clean_x2} F{f}
        G1 X{c.clean_x1} F{f}
    {% endfor %}
    G1 X{c.park_x} F{f}

# Each step says what it is doing with M117: the touch screen and the web
# page show that line while the routine runs.
# LOAD as the stock firmware does it (recorded move by move 2026-11-22),
# with two differences the owner chose: the head waits over the bin
# instead of at X 192, and the nozzle temperature is ours (TEMP=, the
# touch screen's filament choice).
[gcode_macro LOAD_FILAMENT]
description: Load filament pushed in through the opening port, purge into the dump bin, wipe. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    {% if not printer["filament_switch_sensor bay"].filament_detected %}
        {action_raise_error("LOAD_FILAMENT: push the filament in through the opening port until the bay switch trips, then run it again")}
    {% endif %}
    SET_FILAMENT_SENSOR SENSOR=bay ENABLE=0   # the runout pause is for prints, not for this
    M117 Moving to the dump bin
    M106 S{(c.load_fan * 255)|int}
    _SINDOH_PARK
    M104 S{temp}
    M117 Feeding to the extruder
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed STATE=1 DISTANCE={c.feed_max} SPEED={c.feed_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=bay JAM_AFTER=30
    M117 Feeding on while the nozzle heats
    # most of the way while the nozzle heats; every stretch stops if the
    # filament leaves the entry sensor or stands still
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE={c.to_nozzle - c.hot_part} SPEED={c.both_speed} ACCEL={c.feed_accel} FORBID=1 COLD=1 ENCODER=head JAM_AFTER={c.head_after}
    M117 Waiting for the nozzle to reach {temp|int} C
    M109 S{temp}
    M117 Feeding to the nozzle
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE={c.hot_part} SPEED={c.both_speed} ACCEL={c.feed_accel} FORBID=1 ENCODER=head
    M117 Purging into the bin
    M83
    G1 E{c.purge} F{c.purge_speed * 60}
    G4 P500
    G1 E-{c.load_retract} F{c.retract_speed * 60}
    G4 P3000
    M400                            # (so the line changes when the purge is done)
    M117 Wiping the nozzle
    _SINDOH_WIPE
    M400
    M104 S{prev}
    M107
    _SINDOH_BIN_COUNT
    M117
    M118 Load complete
    SET_FILAMENT_SENSOR SENSOR=bay ENABLE=1

# UNLOAD: stock's pulls and speeds. Left out on purpose (owner
# 2026-11-22): stock's stop for cutting the filament at the head (it
# waits at X 212.7 for that) and the cartridge latch (CARTRIDGE_RELEASE,
# only needed with a Sindoh cartridge).
[gcode_macro UNLOAD_FILAMENT]
description: Pull the filament back out of the opening port. TEMP= (default 220)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.load_temp)|float %}
    SET_FILAMENT_SENSOR SENSOR=bay ENABLE=0   # the runout pause is for prints, not for this
    M117 Moving to the dump bin
    M106 S{(c.load_fan * 255)|int}
    _SINDOH_PARK
    M117 Heating the nozzle to {temp|int} C
    M109 S{temp}
    M117 Pulling the filament out of the nozzle
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE=-{c.unload_slow} SPEED={c.unload_slow_speed} ACCEL={c.feed_accel} ENCODER=head
    M117 Pulling the filament back
    FEED_UNTIL SENSOR=extruder_entry STEPPERS=feed,extruder STATE=0 DISTANCE=-{c.unload_max} SPEED={c.both_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=head JAM_UNTIL={c.head_until}
    M104 S{prev}
    M117 Pulling it back to the opening port
    FEED_UNTIL SENSOR=bay STEPPERS=feed STATE=0 DISTANCE=-{c.bay_max} SPEED={c.feed_speed} ACCEL={c.feed_accel} REQUIRE=1 ENCODER=bay JAM_UNTIL={c.bay_until}
    FORCE_MOVE STEPPER="extruder_stepper feed" DISTANCE=-{c.bay_extra} VELOCITY={c.feed_speed} ACCEL={c.feed_accel}
    M107
    M117
    M118 Unload complete - pull the filament out of the opening port
    SET_FILAMENT_SENSOR SENSOR=bay ENABLE=1

# The cartridge latch: a solenoid on PWM block 8. Stock holds it for
# 10 s after every unload; only a Sindoh cartridge needs it.
[gcode_macro CARTRIDGE_RELEASE]
description: Release the cartridge latch for a few seconds (S=seconds, default 10)
gcode:
    SET_PIN PIN=cartridge_latch VALUE=1
    G4 P{(params.S|default(10)|float * 1000)|int}
    SET_PIN PIN=cartridge_latch VALUE=0

# ---------------------------------------------------------------------
# The dump bin (LEFT head; the 2X's right head needs its own count and
# park position). Every purge counts; at bin_threshold the screen asks
# to empty it. EMPTY_BIN moves bed and head out of the way, BIN_EMPTIED
# sets the count back. Stock: head to X 132.4, bed down 118 mm.
# ---------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/x1_variables.cfg

[gcode_macro _SINDOH_BIN_COUNT]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set n = printer.save_variables.variables.bin_count|default(0)|int + 1 %}
    SAVE_VARIABLE VARIABLE=bin_count VALUE={n}
    {% if n >= c.bin_threshold %}
        M118 Purge bin has {n} purges - please empty it, then run BIN_EMPTIED
    {% endif %}

[gcode_macro BIN_EMPTIED]
description: Reset the purge bin counter
gcode:
    SAVE_VARIABLE VARIABLE=bin_count VALUE=0
    M118 Purge bin counter reset

[gcode_macro EMPTY_BIN]
description: Bed down and head aside to take out the dump bin; then BIN_EMPTIED
gcode:
    {% if printer.print_stats.state == "printing" %}
        {action_raise_error("EMPTY_BIN: pause the print first")}
    {% endif %}
    _SINDOH_ENSURE_HOMED
    _EMPTY_BIN_MOVE

[gcode_macro _EMPTY_BIN_MOVE]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    G90
    {% if printer.toolhead.position.z < c.bin_z %}
        G1 Z{c.bin_z} F300
    {% endif %}
    G1 X{c.bin_park_x} F6000
    M118 Bin clear: take it out, empty it, put it back, then BIN_EMPTIED

# ---------------------------------------------------------------------
# Macros the touch screen and the DP200 config share by name. Written
# 2026-11-22 from the stock numbers and the DP200's macros; NONE OF THEM
# HAS RUN ON A 1X. The screen greys out a button whose macro is missing.
# Still to write: EMPTY_BIN counting per head for the 2X.
# ---------------------------------------------------------------------
[gcode_macro _SINDOH_ENSURE_HOMED]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

[gcode_macro _SINDOH_ENSURE_HOMED_XY]
gcode:
    {% if 'x' not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    {% if 'y' not in printer.toolhead.homed_axes %}
        G28 Y
    {% endif %}

# Stock nozzle cleaning (database, this printer): heat to 200 C (PLA),
# push some filament out over the dump station, wipe between X 257.3 and
# 231.3 twice at Z 10, retract. Z is only moved if it is homed.
[gcode_macro CLEAN_NOZZLE]
description: Purge over the dump station and wipe the nozzle (stock routine). TEMP= (default 200), PURGE=0 to wipe only
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.clean_temp)|float %}
    _SINDOH_ENSURE_HOMED_XY
    SAVE_GCODE_STATE NAME=clean_nozzle
    G90
    {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < c.clean_z %}
        G1 Z{c.clean_z} F300
    {% endif %}
    _SINDOH_PARK
    M109 S{temp}
    {% if params.PURGE|default(1)|int %}
        _SINDOH_BIN_COUNT
        M83
        G1 E{c.clean_purge} F{c.purge_speed * 60}
        G1 E-{c.clean_retract} F{c.both_speed * 60}
        G4 P2000
    {% endif %}
    _SINDOH_WIPE
    M104 S{prev}
    RESTORE_GCODE_STATE NAME=clean_nozzle

# Filament dryer: the DP200's (bed as the heat source, spool lying flat).
[gcode_macro _DRY]
variable_active: 0
variable_remaining: 0         # minutes left
variable_total: 0             # minutes
variable_temp: 0
variable_flipped: 0
variable_sheet_max: 70        # build sheet's continuous rating (C)
variable_vent_every: 15       # minutes between vents (exhaust fan 1 min)
gcode:

[gcode_macro FILAMENT_DRY]
description: Dry a spool on the bed. TEMP= (C) HOURS= [MATERIAL=] [FORCE=1 above the sheet limit]
gcode:
    {% set d = printer["gcode_macro _DRY"] %}
    {% set temp = params.TEMP|default(50)|float %}
    {% set hours = params.HOURS|default(4)|float %}
    {% set limit = printer.configfile.settings.heater_bed.max_temp|float %}
    {% if printer.print_stats.state in ('printing', 'paused') %}
        {action_raise_error("FILAMENT_DRY: a print is running")}
    {% elif temp < 35 or temp > limit %}
        {action_raise_error("FILAMENT_DRY: TEMP must be 35..%d C" % limit)}
    {% elif temp > d.sheet_max and params.FORCE|default(0)|int != 1 %}
        {action_raise_error("FILAMENT_DRY: %d C is above the build sheet's %d C limit - add FORCE=1 if your sheet is rated for it" % (temp, d.sheet_max))}
    {% elif hours <= 0 or hours > 24 %}
        {action_raise_error("FILAMENT_DRY: HOURS must be 0..24")}
    {% endif %}
    {% set c = printer["gcode_macro _X1"] %}
    {% set th = printer.toolhead %}
    M104 S0
    _SINDOH_ENSURE_HOMED
    G90
    G1 Z{c.dry_z} F300                          # bed down: room for a spool lying flat
    G1 X{c.park_x} Y{th.axis_maximum.y} F6000   # head off the bed, bed forward to the door
    {% set mins = (hours * 60)|int %}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=remaining VALUE={mins}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=total VALUE={mins}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=flipped VALUE=0
    # idle_timeout would turn the bed off after 10 min without G-code
    SET_IDLE_TIMEOUT TIMEOUT={mins * 60 + 900}
    M140 S{temp}
    UPDATE_DELAYED_GCODE ID=_DRY_TICK DURATION=60
    M118 Drying {params.MATERIAL|default('filament')}: bed {temp|int} C for {hours} h. Put the spool on the bed lying flat and close the doors.

[delayed_gcode _DRY_TICK]
gcode:
    {% set d = printer["gcode_macro _DRY"] %}
    {% if d.active %}
        {% set left = d.remaining - 1 %}
        SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=remaining VALUE={left}
        {% if left <= 0 %}
            _DRY_DONE
        {% else %}
            M140 S{d.temp}                     # in case something turned it off
            {% if (d.total - left) % d.vent_every == 0 %}
                SET_FAN_SPEED FAN=exhaust_right SPEED=0.6
            {% else %}
                SET_FAN_SPEED FAN=exhaust_right SPEED=0
            {% endif %}
            {% if not d.flipped and left <= d.total // 2 %}
                SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=flipped VALUE=1
                M118 Drying: halfway - flip the spool over for even drying
                _DRY_SIGNAL N=2
            {% endif %}
            UPDATE_DELAYED_GCODE ID=_DRY_TICK DURATION=60
        {% endif %}
    {% endif %}

[gcode_macro _DRY_DONE]
gcode:
    _DRY_OFF
    M118 Drying finished - take the spool out (the bed is still warm)
    _DRY_SIGNAL N=5

[gcode_macro FILAMENT_DRY_STOP]
description: Stop the filament dryer (bed off)
gcode:
    {% if printer["gcode_macro _DRY"].active %}
        _DRY_OFF
        M118 Drying stopped
    {% endif %}

[gcode_macro _DRY_OFF]
gcode:
    {% set idle = printer.configfile.settings.idle_timeout %}
    UPDATE_DELAYED_GCODE ID=_DRY_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_DRY VARIABLE=remaining VALUE=0
    M140 S0
    SET_FAN_SPEED FAN=exhaust_right SPEED=0
    SET_IDLE_TIMEOUT TIMEOUT={idle.timeout if idle is defined else 600}

# M300 [P<ms>]: one beep (default 120 ms, the stock single beep) at the
# stock 4 kHz. S<Hz> is accepted and ignored: the firmware sets the pitch.
# Volume = the beeper's duty (stock levels 0.03 / 0.06 / 0.36).
[gcode_macro M300]
variable_volume: 0.36
gcode:
    {% if 'output_pin beeper' in printer %}
        SET_PIN PIN=beeper VALUE={printer["gcode_macro M300"].volume}
        G4 P{params.P|default(120)|int}
        SET_PIN PIN=beeper VALUE=0
    {% endif %}

# Lamp flashes N times, plus the beeper when [output_pin beeper] exists.
[gcode_macro _DRY_SIGNAL]
gcode:
    {% set lamp = printer["output_pin lamp"].value %}
    {% set beep = 'output_pin beeper' in printer %}
    {% for i in range(params.N|default(3)|int) %}
        SET_PIN PIN=lamp VALUE=0
        {% if beep %}
            SET_PIN PIN=beeper VALUE={printer["gcode_macro M300"].volume}
        {% endif %}
        G4 P400
        SET_PIN PIN=lamp VALUE=1
        {% if beep %}
            SET_PIN PIN=beeper VALUE=0
        {% endif %}
        G4 P400
    {% endfor %}
    SET_PIN PIN=lamp VALUE={lamp}

# ---------------------------------------------------------------------
# Idle timeout of the touch screen (SYSTEM -> DISPLAY -> TIMEOUT sets the
# time). The screen program runs SCREEN_TIMEOUT when the printer has been
# idle and untouched that long, and SCREEN_WAKE at the next touch (or when
# a print or heating starts). What goes dark is set here; to change it,
# repeat the section in printer.cfg with only the lines to change, e.g.
#   [gcode_macro SCREEN_TIMEOUT]
#   variable_lamp: 0
# For anything else, replace the two macros in printer.cfg.
# ---------------------------------------------------------------------
[gcode_macro SCREEN_TIMEOUT]
description: Run by the touch screen when its idle timeout ends
variable_display: 1             # 1: the screen goes black (read by the screen program)
variable_lamp: 1                # 1: the case lamp goes off
variable_lamp_was: 0
gcode:
    {% set v = printer["output_pin lamp"].value %}
    {% if lamp and v > 0 %}
        SET_GCODE_VARIABLE MACRO=SCREEN_TIMEOUT VARIABLE=lamp_was VALUE={v}
        SET_PIN PIN=lamp VALUE=0
    {% endif %}

[gcode_macro SCREEN_WAKE]
description: Run by the touch screen when it wakes from its idle timeout
gcode:
    {% set was = printer["gcode_macro SCREEN_TIMEOUT"].lamp_was %}
    {% if was > 0 and printer["output_pin lamp"].value == 0 %}
        SET_PIN PIN=lamp VALUE={was}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SCREEN_TIMEOUT VARIABLE=lamp_was VALUE=0

# ---------------------------------------------------------------------
# BED_FORWARD: bring the bed to the front, to reach the part or the
# sheet (the touch screen's MOVE -> BED FORWARD). Only Y moves; Y is
# homed first if it is not (never Z: a part may be on the bed).
# ---------------------------------------------------------------------
[gcode_macro BED_FORWARD]
description: Bring the bed to the front (only Y moves)
gcode:
    {% if printer.print_stats.state == "printing" %}
        {action_raise_error("BED_FORWARD: not while printing")}
    {% endif %}
    {% if 'y' not in printer.toolhead.homed_axes %}
        G28 Y
    {% endif %}
    SAVE_GCODE_STATE NAME=bed_forward
    G90
    G1 Y{printer.toolhead.axis_maximum.y - 1} F6000
    RESTORE_GCODE_STATE NAME=bed_forward

# ---------------------------------------------------------------------
# JOG AXIS=X|Y|Z D=<mm>: move one axis by a distance (the touch screen's
# MOVE -> JOG page). The axis must be homed; the move stops at the
# axis limits instead of failing.
# ---------------------------------------------------------------------
[gcode_macro JOG]
description: Move one axis by a distance: JOG AXIS=X D=-1
gcode:
    {% set a = params.AXIS|default('X')|upper %}
    {% set dist = params.D|default(0)|float %}
    {% if a not in ('X', 'Y', 'Z') %}
        {action_raise_error("JOG: AXIS must be X, Y or Z")}
    {% endif %}
    {% if a|lower not in printer.toolhead.homed_axes %}
        {action_raise_error("JOG: home " ~ a ~ " first")}
    {% endif %}
    {% set i = 'XYZ'.index(a) %}
    {% set lo = printer.toolhead.axis_minimum[i] %}
    {% set hi = printer.toolhead.axis_maximum[i] %}
    {% set t = [[printer.toolhead.position[i] + dist, lo]|max, hi]|min %}
    SAVE_GCODE_STATE NAME=jog
    G90
    G1 {a}{'%.3f' % t} F{300 if a == 'Z' else 3000}
    RESTORE_GCODE_STATE NAME=jog

# ---------------------------------------------------------------------
# Bed leveling with the nozzle as the probe, after the stock routine
# (sindoh docs/1x_stock_routines.md, "Bed leveling recorded move by
# move"): heat to 150 C, wipe on the cleaning flap without a purge,
# scrub the nozzle clean on the bed (SCRUB=0 leaves that out), then
# touch the three notches three times each. BED_LEVEL reports how the
# two front points stand against the back one; turn the wheels and run
# it again. Stock re-homes every axis before each point; we do not.
# The touches are for LEVELING ONLY: the notches are cut-outs in the
# sheet, where the nozzle reaches the metal plate below the print
# surface. Never take Z 0 or a mesh from them (owner 2026-11-22).
# The report gives the difference in millimeters and in wheel clicks.
# ---------------------------------------------------------------------
# _LEVEL holds the last result and what a wheel click does; the touch
# screen's bed level page reads it (docs/touchscreen.md).
[gcode_macro _LEVEL]
variable_back: 0.0              # touch heights of the last BED_LEVEL
variable_fl: 0.0
variable_fr: 0.0
variable_click: 0.19            # mm per wheel click (45 degrees) at the notch (owner and the
                                # stock recording, 2026-11-22; 0.16 measured under Klipper)
variable_cw_raises: 1           # clockwise seen from above raises the corner
variable_ok: 0.05               # mm: a front point this close to the back one needs no turn
gcode:

[gcode_macro BED_LEVEL]
description: Measure the bed at its three notches with the nozzle and report. SCRUB=0 skips the nozzle scrub, TEMP= (default 150)
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set prev = printer.extruder.target %}
    {% set temp = params.TEMP|default(c.level_temp)|float %}
    {% if printer.print_stats.state == "printing" %}
        {action_raise_error("BED_LEVEL: not while printing")}
    {% endif %}
    M117 Homing
    _SINDOH_ENSURE_HOMED
    M117 Heating the nozzle to {temp|int} C
    M109 S{temp}
    M117 Wiping the nozzle
    G90
    G1 Z{c.level_travel_z} F300
    _SINDOH_PARK
    _SINDOH_WIPE
    {% if params.SCRUB|default(1)|int %}
        M400
        M117 Scrubbing the nozzle on the bed
        NOZZLE_SCRUB
    {% endif %}
    M400
    M117 Measuring the back point
    _LEVEL_POINT NAME=back X={c.level_back_x} Y={c.level_back_y}
    M117 Measuring the front left point
    _LEVEL_POINT NAME=fl X={c.level_fl_x} Y={c.level_fl_y}
    M117 Measuring the front right point
    _LEVEL_POINT NAME=fr X={c.level_fr_x} Y={c.level_fr_y}
    G1 Y{printer.toolhead.axis_maximum.y - 1} F6000      # bed forward, to reach the wheels
    M400
    M104 S{prev}
    M117
    _LEVEL_REPORT

[gcode_macro _LEVEL_POINT]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    G90
    G1 Z{c.level_travel_z} F300
    G1 X{params.X} Y{params.Y} F6000
    PROBE
    _LEVEL_STORE NAME={params.NAME}
    G90
    G1 Z{c.level_travel_z} F300

[gcode_macro _LEVEL_STORE]
gcode:
    SET_GCODE_VARIABLE MACRO=_LEVEL VARIABLE={params.NAME} VALUE={printer.probe.last_z_result}

# The bed rises to touch the nozzle, so a LOWER touch height means the
# bed stands LOWER there.
[gcode_macro _LEVEL_REPORT]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set l = printer["gcode_macro _LEVEL"] %}
    M118 Bed level: touch heights back {'%.3f' % l.back}, front left {'%.3f' % l.fl}, front right {'%.3f' % l.fr}
    {% for name, v in (('Front left', l.fl), ('Front right', l.fr)) %}
        {% set d = v - l.back %}
        {% set n = (d|abs / l.click)|round|int %}
        {% if d|abs <= l.ok or n == 0 %}
            M118 {name}: level with the back ({'%+.2f' % d} mm)
        {% elif d > 0 %}
            M118 {name}: {'%.2f' % d} mm HIGHER than the back - turn its wheel {n} click{'s' if n > 1 else ''} {'COUNTER-CLOCKWISE' if l.cw_raises else 'CLOCKWISE'} (seen from above)
        {% else %}
            M118 {name}: {'%.2f' % (-d)} mm LOWER than the back - turn its wheel {n} click{'s' if n > 1 else ''} {'CLOCKWISE' if l.cw_raises else 'COUNTER-CLOCKWISE'} (seen from above)
        {% endif %}
    {% endfor %}

# The scrub: the bed comes up scrub_depth past the print surface, pressing
# the SHEET hard against the nozzle (the sheet covers these places; the
# bed gives on its springs), and drags it along the left edge and the back of the
# sheet, where stock does it: Y 125 to 185 at X 227.5, then X 165 to 225
# at Y 184, straight and in a zigzag. Shortened from stock's 85 s: the
# passes without contact and the repeats are left out.
[gcode_macro NOZZLE_SCRUB]
description: Scrub the nozzle clean on the bed, as stock does before leveling
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set up = c.level_travel_z %}
    {% set dn = -c.scrub_depth %}
    {% if dn < printer.toolhead.axis_minimum.z %}
        {action_raise_error("NOZZLE_SCRUB: the scrub height is below the Z minimum")}
    {% endif %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("NOZZLE_SCRUB: home all axes first")}
    {% endif %}
    G90
    G1 Z{up} F300
    G1 X227.5 Y125.2 F6000
    G1 Z{dn} F240
    G1 Y185.2 F1800
    G1 Y125.2 F1800
    {% for f in (1800, 600) %}
        {% for i in range(8) %}
            G1 X{228.5 if i % 2 == 0 else 226.5} Y{125.2 + 7.5 * (i + 1)} F{f}
        {% endfor %}
        {% for i in range(8) %}
            G1 X{228.5 if i % 2 == 0 else 226.5} Y{185.2 - 7.5 * (i + 1)} F{f}
        {% endfor %}
    {% endfor %}
    G1 Z{up} F240
    G1 X225 Y184.1 F6000
    G1 Z{dn} F240
    {% for n in range(2) %}
        {% for i in range(4) %}
            G1 X{225 - 15 * (i + 1)} Y{188.1 if i % 2 == 0 else 184.1} F2400
        {% endfor %}
        {% for i in range(4) %}
            G1 X{165 + 15 * (i + 1)} Y{188.1 if i % 2 == 0 else 184.1} F2400
        {% endfor %}
    {% endfor %}
    G1 Z{up} F240

# ---------------------------------------------------------------------
# Printing: start, pause, resume, cancel, end. The DP200's routines
# (dp200_printer.cfg), with the 1X's dump station and without a bed
# mesh: the 1X has no mesh probe, the bed is leveled by hand with
# BED_LEVEL. WRITTEN 2026-11-22, NOT RUN YET.
# Slicer start G-code:  PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]
# Slicer end G-code:    PRINT_END
# ---------------------------------------------------------------------
[gcode_macro PRINT_START]
description: Heat, home, purge and wipe. BED= EXTRUDER= (asks if the bed is empty first)
variable_pending: ''
variable_starting: 0           # 1 while the start runs after the bed question (job still paused)
gcode:
    {% set args = 'BED=%s EXTRUDER=%s' % (params.BED|default(60), params.EXTRUDER|default(210)) %}
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=starting VALUE=0
    {% if printer["gcode_macro BED_CLEAR"].ok %}
        _PRINT_START_BODY {args}
    {% else %}
        # Z homes upward: a part left on the bed would be crushed. Pause
        # before anything moves or heats and ask; YES (BED_CLEAR) runs the
        # rest of the start and resumes, NO (BED_CLEAR CANCEL=1) cancels.
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=pending VALUE="'{args}'"
        BASE_PAUSE
        _BED_CLEAR_ASK
        M118 Print waiting: is the bed empty? YES on the screen or in Mainsail starts it, NO cancels
    {% endif %}

[gcode_macro _PRINT_START_BODY]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set bed = params.BED|default(60)|float %}
    {% set ext = params.EXTRUDER|default(210)|float %}
    FILAMENT_DRY_STOP          # a print ends a running filament dryer
    M117 Heating the bed to {bed|int} C
    M140 S{bed}
    M104 S150                  # warm the nozzle without oozing meanwhile
    G28
    M190 S{bed}
    M117 Heating the nozzle to {ext|int} C
    CLEAN_NOZZLE TEMP={ext}    # to the bin, heats, purges, wipes
    M109 S{ext}
    # CLEAN_NOZZLE leaves the filament retracted: push it back over the
    # bin, let it ooze, wipe, then to the middle of the bed at Z 10
    M117 Priming
    _SINDOH_PARK
    M83
    G1 E{c.clean_retract} F{c.both_speed * 60}
    G1 E2 F{c.purge_speed * 60}
    G4 P1000
    _SINDOH_WIPE
    G90
    G1 Z10 F600
    G1 X110 Y100 F6000
    G92 E0
    M400
    M117

[gcode_macro PRINT_END]
description: End of print - retract, heaters and fan off, lift, head to the bin, bed forward
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set th = printer.toolhead %}
    M83
    G1 E-2 F2100
    TURN_OFF_HEATERS
    M106 S0
    G90
    G1 Z{[th.position.z + 10, th.axis_maximum.z]|min} F300
    G1 X{c.park_via_x} F6000
    G1 X{c.park_x} Y{th.axis_maximum.y - 5} F6000
    M84

# PAUSE / RESUME / CANCEL_PRINT (needed by Mainsail and by the runout
# sensor). [pause_resume] saves and restores the G-code state, including
# the move back, so these only add retract, lift and the move to the bin.
[gcode_macro PAUSE]
description: Pause the print - retract, lift, head to the bin
rename_existing: BASE_PAUSE
variable_retract: 1.0
variable_lift: 10.0
variable_temp: 0               # nozzle target when paused (RESUME heats back to it)
variable_bed: 0                # bed target when paused (RESUME heats back to it)
variable_reprime: 0            # 1 = filament moved or nozzle cooled while paused: RESUME re-primes
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Already paused
    {% else %}
        {% set c = printer["gcode_macro _X1"] %}
        {% set th = printer.toolhead %}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=temp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=bed VALUE={printer.heater_bed.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=reprime VALUE=0
        BASE_PAUSE
        {% if printer.extruder.can_extrude %}
            M83
            G1 E-{retract} F2100
        {% endif %}
        {% if th.homed_axes == "xyz" %}
            G90
            G1 Z{[th.position.z + lift, th.axis_maximum.z]|min} F300
            G1 X{c.park_via_x} F6000
            G1 X{c.park_x} F6000
        {% endif %}
    {% endif %}

[gcode_macro RESUME]
description: Resume the print - un-retract, move back, continue
rename_existing: BASE_RESUME
gcode:
    {% if not printer.pause_resume.is_paused %}
        M118 Not paused
    {% elif printer["gcode_macro PRINT_START"].pending %}
        {action_raise_error("The print is waiting for the bed check: answer YES (bed empty) or NO")}
    {% elif printer["gcode_macro PRINT_START"].starting %}
        {action_raise_error("The print is still starting (heating, homing): it continues by itself")}
    {% else %}
        {% set p = printer["gcode_macro PAUSE"] %}
        UPDATE_DELAYED_GCODE ID=_PAUSE_BED_OFF DURATION=0
        {% if p.bed > 0 and printer.heater_bed.target < p.bed %}
            M118 Resume: heating the bed back to {p.bed|int} C
            M190 S{p.bed}
        {% endif %}
        {% if p.temp > 0 and (p.reprime or printer.extruder.target < p.temp) %}
            _SINDOH_REPRIME
        {% endif %}
        _SINDOH_UNRETRACT
        BASE_RESUME {rawparams}
    {% endif %}

# Separate macro so can_extrude is read after the re-prime has heated
[gcode_macro _SINDOH_UNRETRACT]
gcode:
    {% if printer.extruder.can_extrude %}
        M83
        G1 E{printer["gcode_macro PAUSE"].retract} F2100
    {% endif %}

# RESUME after a load, unload or cleaning, or a cooled nozzle during the
# pause: heat back, refill over the bin, retract exactly PAUSE's amount
# and wipe, so RESUME's un-retract leaves the nozzle as after a plain pause.
[gcode_macro _SINDOH_REPRIME]
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set p = printer["gcode_macro PAUSE"] %}
    M118 Resume: heating to {p.temp|int} C and re-priming over the bin
    _SINDOH_PARK
    M109 S{p.temp}
    M83
    G1 E{c.load_retract + 5} F{c.purge_speed * 60}
    G4 P1000
    G1 E-{p.retract} F2100
    _SINDOH_WIPE
    M400
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=reprime VALUE=0

# Idle timeout (Klipper's default turns heaters AND motors off after 10 min,
# also during a pause: the print position is lost and RESUME fails). While
# paused: nozzle off (RESUME reheats and re-primes), bed and motors stay on
# so the part stays stuck and the position is kept; the bed goes off after
# 4 h more. Otherwise as the default.
[idle_timeout]
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=reprime VALUE=1
        UPDATE_DELAYED_GCODE ID=_PAUSE_BED_OFF DURATION=14400
        M118 Paused 10 min: nozzle heater off, bed and motors kept on. RESUME reheats.
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

[delayed_gcode _PAUSE_BED_OFF]
gcode:
    {% if printer.pause_resume.is_paused %}
        M140 S0
        M118 Paused over 4 h: bed heater off too (motors kept on)
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the print - heaters and fan off, lift, head to the bin
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set c = printer["gcode_macro _X1"] %}
    {% set th = printer.toolhead %}
    TURN_OFF_HEATERS
    M106 S0
    {% if th.homed_axes == "xyz" %}
        G90
        G1 Z{[th.position.z + 10, th.axis_maximum.z]|min} F300
        G1 X{c.park_via_x} F6000
        G1 X{c.park_x} F6000
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=starting VALUE=0
    M117
    CLEAR_PAUSE
    BASE_CANCEL_PRINT

[gcode_macro LAMP_TOGGLE]
description: Switch the chamber light on or off (the touch screen's LAMP button)
gcode:
    SET_PIN PIN=lamp VALUE={0 if printer["output_pin lamp"].value > 0 else 1}

# Z homes upward to a sensor near the nozzle: anything on the bed is
# crushed (DP200, 2026-10-28). Every Z homing needs BED_CLEAR first; one
# BED_CLEAR allows one Z homing within 5 minutes.
[homing_override]
axes: xyz
gcode:
    {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if (all or 'Z' in params) and not printer["gcode_macro BED_CLEAR"].ok %}
        _BED_CLEAR_ASK
        _BED_CLEAR_FAIL
    {% endif %}
    QUERY_ENDSTOPS
    {% if all or 'X' in params %}
        _SINDOH_HOME_AXIS AXIS=X
    {% endif %}
    {% if all or 'Y' in params %}
        _SINDOH_HOME_AXIS AXIS=Y
    {% endif %}
    {% if all or 'Z' in params %}
        G28 Z
        SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=0
    {% endif %}

# X and Y as stock homes them: an axis that is already on its home
# sensor first moves off it by a set distance, then homes. The sensors
# stay on from their edge all the way to the end of travel (X: 19.3 mm,
# with the dump station inside it; Y: 5.8 mm; measured 2026-11-22), so
# Klipper's own short back-off cannot clear them. home_off_x /
# home_off_y in _X1 are that stretch plus 5 mm. (No digit in the name:
# Klipper cannot pass parameters to a command with one.)
[gcode_macro _SINDOH_HOME_AXIS]
gcode:
    {% set a = params.AXIS|lower %}
    {% set c = printer["gcode_macro _X1"] %}
    {% if printer.query_endstops.last_query['stepper_' ~ a] %}
        FORCE_MOVE STEPPER=stepper_{a} DISTANCE={c.home_off_x if a == 'x' else c.home_off_y} VELOCITY=100 ACCEL=250
    {% endif %}
    G28 {a|upper}

[gcode_macro BED_CLEAR]
description: Confirm the bed is empty so Z may home (CANCEL=1 to decline)
variable_ok: 0
variable_asking: 0
gcode:
    SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=asking VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set pend = printer["gcode_macro PRINT_START"].pending %}
    {% if params.CANCEL|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=0
        M118 Homing cancelled - clear the bed first
        {% if pend %}
            # a print waiting in PRINT_START: cancel it
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=pending VALUE="''"
            CANCEL_PRINT
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=1
        UPDATE_DELAYED_GCODE ID=_BED_CLEAR_EXPIRE DURATION=300
        M118 Bed confirmed empty - one Z homing allowed in the next 5 min (repeat a refused command)
        {% if pend and printer.pause_resume.is_paused %}
            # a print waiting in PRINT_START: run the start now, then resume
            # from here (the pause saved the position from before homing).
            # 'starting' marks the job as starting, not paused.
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=pending VALUE="''"
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=starting VALUE=1
            _PRINT_START_BODY {pend}
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=starting VALUE=0
            SAVE_GCODE_STATE NAME=PAUSE_STATE
            BASE_RESUME
        {% endif %}
    {% endif %}

[delayed_gcode _BED_CLEAR_EXPIRE]
gcode:
    SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=ok VALUE=0

[gcode_macro _BED_CLEAR_ASK]
gcode:
    SET_GCODE_VARIABLE MACRO=BED_CLEAR VARIABLE=asking VALUE=1
    RESPOND TYPE=command MSG="action:prompt_begin Is the bed empty?"
    RESPOND TYPE=command MSG="action:prompt_text Homing Z raises the bed to the top. Anything on it gets crushed against the head."
    RESPOND TYPE=command MSG="action:prompt_footer_button NO|BED_CLEAR CANCEL=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button YES, EMPTY|BED_CLEAR|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _BED_CLEAR_FAIL]
gcode:
    {action_raise_error("Is the bed empty? Homing Z raises the bed to the top. Confirm with BED_CLEAR (screen: YES), then try again.")}


