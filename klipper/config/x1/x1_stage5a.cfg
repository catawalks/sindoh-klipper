# ADC inputs as the stock IO microcode scans them (mux select 1 to 4).
# Select 4 reads open on the 1X (the 2X's second nozzle) and is left out.
# min_temp/max_temp must stay inside the tables: Klipper turns them into
# ADC limits and shuts the MCU down ("ADC out of range") otherwise.
[temperature_sensor nozzle]
sensor_type: x1_nozzle
sensor_pin: io:adc1
adc_voltage: 1.0
min_temp: 2
max_temp: 290

[temperature_sensor bed]
sensor_type: x1_bed
sensor_pin: io:adc2
adc_voltage: 1.0
min_temp: 2
max_temp: 120

# Reads the same as select 2 under stock; what it is, is not known yet.
[temperature_sensor bed_b]
sensor_type: x1_bed
sensor_pin: io:adc3
adc_voltage: 1.0
min_temp: 2
max_temp: 120

# Inputs on the SoC GPIO block (Linux GPIO numbers). Names from the
# stock program; which level means "filament present" is to be checked.
[gcode_button cart_filament_0]
pin: gpio76
press_gcode:

[gcode_button cart_filament_1]
pin: gpio80
press_gcode:

[gcode_button extr_filament_0]
pin: gpio121
press_gcode:

[gcode_button extr_filament_1]
pin: gpio120
press_gcode:

# Home sensors, found 2026-11-21 by moving the head and bed by hand under
# the stock firmware and again under Klipper. X (head, homes left) and
# Y (bed, homes at the back) are both high at home, so "PRESSED" below
# means "at home".
[gcode_button x_home]
pin: gpio99
press_gcode:

[gcode_button y_home]
pin: gpio82
press_gcode:

# Z home (seen changing once per stock Z homing; level at home not checked)
[gcode_button z_home]
pin: gpio83
press_gcode:

# Nozzle-to-bed contact (bed leveling). Stock switches its enable line
# (GPIO 153) on first; without that this reading means nothing.
[gcode_button nozzle_contact]
pin: gpio81
press_gcode:

# ---------------------------------------------------------------------
# Outputs under test (dec_pwm blocks; the firmware uses each block's
# stock period, cycle_time is ignored).
# ---------------------------------------------------------------------
# Case lights: a static level on block 7.
[output_pin lights]
pin: io:pwm7
value: 1
shutdown_value: 0

# Beeper: block 19, 4 kHz; the value is the duty (stock 90/250 = 0.36).
[output_pin beeper]
pin: io:pwm19
pwm: True
hardware_pwm: True
cycle_time: 0.00025
value: 0
shutdown_value: 0

# Fan blocks (period 100), as found with the owner watching: block 2 is
# the part cooling fan, 20 the back right exhaust fan, 14 and 22 drive
# nothing on the 1X. Block 10 is the power supply fan; it is left alone
# here so it keeps running as stock left it.
[output_pin fan_b2]
pin: io:pwm2
pwm: True
hardware_pwm: True
cycle_time: 0.0001
value: 0
shutdown_value: 0

[output_pin fan_b14]
pin: io:pwm14
pwm: True
hardware_pwm: True
cycle_time: 0.0001
value: 0
shutdown_value: 0

[output_pin fan_b20]
pin: io:pwm20
pwm: True
hardware_pwm: True
cycle_time: 0.0001
value: 0
shutdown_value: 0

[output_pin fan_b22]
pin: io:pwm22
pwm: True
hardware_pwm: True
cycle_time: 0.0001
value: 0
shutdown_value: 0

# Fan enable lines on the SoC GPIO block (names from the stock program):
# GPIO 188 is the extruder (hot end) fan, 112 the back left exhaust fan,
# 225 drives nothing on the 1X. GPIO 127 (PSU fan enable, high under
# stock) is left alone.
[output_pin en_nozzle_fan0]
pin: io:gpio225
value: 0
shutdown_value: 0

[output_pin en_nozzle_fan1]
pin: io:gpio188
value: 0
shutdown_value: 0

[output_pin en_main_fan1]
pin: io:gpio112
value: 0
shutdown_value: 0
