# Sindoh 3DWOX 1X: stage 5a of the port (docs/1x_port_plan.md).
# Stage 5a: as stage 4 (thermistors, inputs) plus the case lights, the
# beeper and four fan outputs. No heater and no motor is defined.
# Started by install/x1/x1_stage4.sh start x1_stage5a.cfg; not a printer config yet.

[mcu]
serial: /tmp/klipper_upc_fm
restart_method: command

[mcu io]
serial: /tmp/klipper_upc_io
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

