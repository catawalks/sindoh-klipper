# =====================================================================
# Sindoh 3DWOX 1 - YOUR printer.cfg
# =====================================================================
# The hardware definition and the macros come from the included files,
# which updates replace. This file is yours and is never overwritten:
# - put your own changes and overrides here (a section repeated here adds
#   to / overrides the included one);
# - the per-printer values below are written by calibration commands, then
#   SAVE_CONFIG (which only works for options that are NOT in an include).
#
# The values below are those of the first 3DWOX 1 (Fredrik Gustafsson's,
# 2026-11-12/13; see 3dwox1_printer.cfg for where they come from).
# Calibrate your own printer and SAVE_CONFIG.
# =====================================================================

[include 3dwox1_printer.cfg]
[include dp200_macros.cfg]

# --- per-printer calibration -----------------------------------------
[stepper_z]
# Z switch height above the bed: paper test (LV_PROBE_CALIBRATE) or
# Z_ENDSTOP_CALIBRATE. First 3DWOX 1: 2.725.
position_endstop: 2.725

[probe]
# Pin position relative to the nozzle (measure with a ruler): the pin sits
# front-right of the nozzle (front = lower Y). DP200 values; not yet
# re-measured on a 3DWOX 1.
x_offset: 23.5   # measured 2026-10-27 on the test printer (printed pad + probe scan)
y_offset: -28.0
# Pin tip below the nozzle: LV_PROBE_CALIBRATE -> paper test -> ACCEPT ->
# LV_PROBE_CALIBRATE_SAVE Z=<accepted> -> SAVE_CONFIG. First 3DWOX 1: 2.711.
z_offset: 2.711

[extruder]
# Gains measured on the first 3DWOX 1 (2026-11-12, 210 C, max_power 0.6).
# Run PID_CALIBRATE HEATER=extruder TARGET=210, then SAVE_CONFIG, for your own printer.
control: pid
pid_Kp: 14.565
pid_Ki: 1.566
pid_Kd: 33.865

[heater_bed]
# DP200 gains (2026-10-21, 60 C, max_power 1.0); not yet calibrated on a 3DWOX 1.
# Run PID_CALIBRATE HEATER=heater_bed TARGET=60, then SAVE_CONFIG, for your own printer.
control: pid
pid_Kp: 74.532
pid_Ki: 1.252
pid_Kd: 1109.592
