# =====================================================================
# Sindoh 3DWOX 1 - what differs from the DP200's hardware definition
# =====================================================================
# The 3DWOX 1 runs the DP200's firmware, hardware file and macros
# (sindoh docs/3dwox1.md). This file includes dp200_printer.cfg and
# changes the few settings that differ. Included by printer.cfg and
# replaced on updates: put your own changes in printer.cfg. Same layout
# as the other models (x1/x1_printer.cfg).
#
# Provenance: the values are Fredrik Gustafsson's (GitHub
# jagheterfredrik), measured on his 3DWOX 1 on 2026-11-12/13 and taken
# from his repository klipper-sindoh, klipper/config/3dwox1/printer.cfg,
# commit a04b2bfa. On 2026-11-22 that one file was split into this file
# (the model) and printer.cfg (the printer), with no value changed.
# Nothing here has been tried by us: we have no 3DWOX 1. One unit is all
# the evidence there is for "the model" so far.
#
# Motor current is NOT set here. The installer reads each printer's own
# offsets from its stock database and writes dp200_machine.cfg, which
# dp200_printer.cfg includes. His unit's database has +99 on every axis,
# which gives 0.995; the DP200's defaults (0.425 .. 0.75) are far too
# low for it. Without the installer's file, set the four
# [output_pin motor_current_*] values in printer.cfg.
# =====================================================================

[include dp200_printer.cfg]

[printer]
# Slower than the DP200 defaults (210 mm/s, 1500 mm/s2; Z 5 mm/s, 100 mm/s2):
# on his 3DWOX 1 the default X/Y homing was too violent and Z stalled.
max_accel: 500
max_z_velocity: 3
max_z_accel: 20

[stepper_x]
homing_speed: 50

[stepper_y]
homing_speed: 50

[stepper_z]
homing_speed: 3
second_homing_speed: 0.5       # stock backs off at 0.39 mm/s, at most 1.26 mm
homing_retract_dist: 2         # (5 would take 10 s at 0.5 mm/s)

# Load the saved "default" bed mesh at start-up, when there is one. From
# his set-up, where the print start makes no mesh unless asked. Our print
# start (dp200_printer.cfg) makes a fresh mesh every time, so this only
# matters between prints.
[delayed_gcode load_bed_mesh]
initial_duration: 2
gcode:
    {% if 'default' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}
